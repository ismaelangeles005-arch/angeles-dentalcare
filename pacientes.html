<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pacientes - Angeles DentalCare</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <style>
        .patients-page .main {
            flex: 1;
            min-width: 0;
            padding: 24px clamp(18px, 2.4vw, 30px);
        }

        .patients-page .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .patients-page .topbar h1 {
            margin: 0;
            color: var(--color-primary-dark);
            font-size: clamp(24px, 2.3vw, 34px);
            line-height: 1.1;
        }

        .patients-page .form-box,
        .patients-page .search-box,
        .patients-page .patient-card,
        .patients-page .clinical-dialog,
        .patients-page .preview-dialog {
            border: 1px solid var(--color-border);
            background: rgba(255, 255, 255, 0.96);
            box-shadow: var(--shadow-sm);
        }

        .patients-page .form-box {
            padding: 20px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
        }

        .patients-page .form-box h2 {
            margin: 0;
            color: var(--color-primary-dark);
            font-size: 20px;
        }

        .patients-page .form-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .patients-page .form-grid input,
        .patients-page .form-grid select,
        .patients-page .form-grid textarea,
        .patients-page .upload-panel input,
        .patients-page .upload-panel select {
            width: 100%;
            min-height: var(--control-height);
            padding: 10px 12px;
            border: 1px solid rgba(148, 163, 184, 0.42);
            border-radius: var(--radius-md);
            background: #fff;
            color: var(--color-text);
            font: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .patients-page .form-grid input:focus,
        .patients-page .form-grid select:focus,
        .patients-page .form-grid textarea:focus,
        .patients-page .upload-panel input:focus,
        .patients-page .upload-panel select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 166, 0.12);
        }

        .patients-page .form-grid textarea {
            min-height: 82px;
            resize: vertical;
            grid-column: span 3;
        }

        .patients-page .add-btn,
        .patients-page .actions button,
        .patients-page .file-actions button {
            min-height: 38px;
            border: 0;
            border-radius: var(--radius-md);
            padding: 9px 12px;
            color: #fff;
            cursor: pointer;
            font-weight: 800;
            font-size: 13px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .patients-page .add-btn {
            margin-top: 16px;
            background: var(--color-primary);
            box-shadow: 0 10px 22px rgba(37, 99, 166, 0.18);
        }

        .patients-page .actions button:hover,
        .patients-page .file-actions button:hover,
        .patients-page .add-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.02);
        }

        .patients-page .actions button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
            filter: grayscale(0.2);
        }

        .patients-page .search-box {
            position: sticky;
            top: 12px;
            z-index: 3;
            padding: 12px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .patients-page .search-box input {
            width: 100%;
            min-height: var(--control-height);
            padding: 11px 14px 11px 40px;
            border: 1px solid rgba(148, 163, 184, 0.42);
            border-radius: var(--radius-md);
            background: #fff;
            color: var(--color-text);
            outline: none;
        }

        .patients-page .search-box::before {
            content: "\f002";
            position: absolute;
            left: 28px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 14px;
        }

        .patients-page .patient-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 14px;
            align-items: stretch;
        }

        .patients-page .patient-card {
            display: grid;
            gap: 12px;
            padding: 16px;
            border-radius: var(--radius-lg);
            border-left: 4px solid rgba(47, 167, 160, 0.72);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .patients-page .patient-card:hover {
            transform: translateY(-2px);
            border-color: rgba(37, 99, 166, 0.36);
            box-shadow: var(--shadow-md);
        }

        .patients-page .patient-card header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
        }

        .patients-page .patient-card h3 {
            min-width: 0;
            margin: 0;
            color: var(--color-primary-dark);
            font-size: 18px;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .patients-page .patient-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-end;
        }

        .patients-page .patient-badge {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            min-height: 24px;
            padding: 4px 9px;
            border-radius: 999px;
            background: rgba(37, 99, 166, 0.12);
            color: var(--color-primary-dark);
            font-size: 11px;
            font-weight: 900;
            white-space: nowrap;
        }

        .patients-page .patient-badge.neutral {
            background: rgba(100, 116, 139, 0.12);
            color: #475569;
        }

        .patients-page .patient-badge.mine {
            background: rgba(46, 139, 114, 0.16);
            color: #17624e;
        }

        .patients-page .patient-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px 12px;
        }

        .patients-page .meta-item {
            min-width: 0;
            padding: 9px 10px;
            border-radius: var(--radius-md);
            background: rgba(244, 248, 251, 0.92);
        }

        .patients-page .meta-label {
            display: block;
            color: var(--color-text-muted);
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .patients-page .meta-value {
            display: block;
            margin-top: 3px;
            color: var(--color-text);
            font-size: 13px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .patients-page .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 2px;
            padding-top: 12px;
            border-top: 1px solid var(--color-border);
        }

        .patients-page .view-btn,
        .patients-page .complete-btn { background: var(--color-primary); }
        .patients-page .assign-btn { background: #475569; }
        .patients-page .file-btn { background: var(--color-secondary); }
        .patients-page .delete-btn { background: var(--color-error); }
        .patients-page .confirm-btn { background: var(--color-success); }

        .patients-page .clinical-backdrop,
        .patients-page .preview-backdrop {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: grid;
            place-items: center;
            padding: 18px;
            background: rgba(15, 23, 42, 0.56);
        }

        .patients-page .preview-backdrop { z-index: 100; background: rgba(15, 23, 42, 0.78); }
        .patients-page .clinical-backdrop[hidden],
        .patients-page .preview-backdrop[hidden] { display: none; }

        .patients-page .clinical-dialog {
            width: min(920px, 100%);
            max-height: min(720px, calc(100vh - 36px));
            overflow-y: auto;
            border-radius: var(--radius-lg);
        }

        .patients-page .clinical-header,
        .patients-page .preview-header {
            position: sticky;
            z-index: 2;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--color-border);
            background: rgba(255,255,255,0.98);
        }

        .patients-page .clinical-header h2,
        .patients-page .preview-header h3 {
            margin: 0;
            color: var(--color-primary-dark);
        }

        .patients-page .clinical-header p {
            margin: 4px 0 0;
            color: var(--color-text-muted);
            font-weight: 700;
        }

        .patients-page .clinical-close {
            width: 38px;
            height: 38px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: #fff;
            color: var(--color-primary-dark);
            cursor: pointer;
            font-size: 22px;
        }

        .patients-page .clinical-body { padding: 18px 20px 20px; }

        .patients-page .clinical-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 10px;
        }

        .patients-page .clinical-tab {
            border: 1px solid var(--color-border);
            background: #fff;
            border-radius: var(--radius-md);
            color: var(--color-text-muted);
            cursor: pointer;
            font-weight: 800;
            padding: 9px 12px;
        }

        .patients-page .clinical-tab.active,
        .patients-page .clinical-tab:focus-visible {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #fff;
            outline: none;
        }

        .patients-page .clinical-panel[hidden] { display: none; }

        .patients-page .clinical-info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .patients-page .clinical-info-item {
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 11px;
            background: rgba(244, 248, 251, 0.72);
            min-width: 0;
        }

        .patients-page .clinical-info-item span {
            display: block;
            color: var(--color-text-muted);
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .patients-page .clinical-info-item strong {
            display: block;
            overflow-wrap: anywhere;
        }

        .patients-page .clinical-note-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .patients-page .clinical-note-form textarea,
        .patients-page .clinical-note-form input,
        .patients-page .clinical-note-form select {
            width: 100%;
        }

        .patients-page .clinical-note-form textarea { min-height: 82px; }
        .patients-page .clinical-note-form .span-2 { grid-column: 1 / -1; }

        .patients-page .clinical-timeline {
            display: grid;
            gap: 10px;
        }

        .patients-page .clinical-note-card {
            border-left: 4px solid var(--color-primary);
        }

        .patients-page .odontogram-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.8fr);
            gap: 14px;
            align-items: start;
        }

        .patients-page .odontogram-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .patients-page .odontogram-toolbar label {
            color: var(--color-text-muted);
            font-size: 12px;
            font-weight: 800;
        }

        .patients-page .odontogram-toolbar select {
            min-width: 140px;
        }

        .patients-page .odontogram-arch {
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: rgba(244, 248, 251, 0.72);
            padding: 12px;
            margin-bottom: 10px;
        }

        .patients-page .odontogram-arch-title {
            color: var(--color-text-muted);
            display: block;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .patients-page .odontogram-tooth-grid {
            display: grid;
            grid-template-columns: repeat(16, minmax(32px, 1fr));
            gap: 6px;
        }

        .patients-page .odontogram-tooth {
            position: relative;
        }

        .patients-page .odontogram-tooth.has-record::after {
            content: "";
            position: absolute;
            top: 5px;
            right: 5px;
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: var(--color-primary);
        }

        .patients-page .odontogram-detail {
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: #fff;
            padding: 14px;
        }

        .patients-page .odontogram-detail h3 {
            color: var(--color-primary-dark);
            margin: 0 0 8px;
        }

        .patients-page .odontogram-entry {
            border-top: 1px solid var(--color-border);
            padding-top: 10px;
            margin-top: 10px;
        }

        .patients-page .odontogram-entry span {
            color: var(--color-text-muted);
            display: block;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 3px;
        }

        .patients-page .odontogram-condition-form {
            border-top: 1px solid var(--color-border);
            display: grid;
            gap: 9px;
            margin-top: 12px;
            padding-top: 12px;
        }

        .patients-page .odontogram-condition-form label {
            color: var(--color-text-muted);
            display: grid;
            font-size: 12px;
            font-weight: 800;
            gap: 5px;
        }

        .patients-page .odontogram-condition-form textarea {
            min-height: 72px;
            resize: vertical;
        }

        .patients-page .odontogram-entry-group {
            border-top: 1px solid var(--color-border);
            margin-top: 10px;
            padding-top: 10px;
        }

        .patients-page .odontogram-entry-group h4 {
            color: var(--color-primary-dark);
            margin: 0 0 8px;
        }

        .patients-page .odontogram-custom-diagnosis[hidden] {
            display: none;
        }

        @media (max-width: 900px) {
            .patients-page .odontogram-layout { grid-template-columns: 1fr; }
            .patients-page .odontogram-tooth-grid { grid-template-columns: repeat(8, minmax(34px, 1fr)); }
        }

        .patients-page .upload-panel {
            display: grid;
            grid-template-columns: 170px 1fr;
            gap: 10px;
            padding: 14px;
            border: 1px solid rgba(47, 167, 160, 0.22);
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, rgba(47, 167, 160, 0.08), rgba(37, 99, 166, 0.05));
        }

        .patients-page .upload-panel input[type="file"],
        .patients-page .upload-panel .add-btn { grid-column: 1 / -1; }
        .patients-page .upload-panel .add-btn { justify-self: start; margin-top: 0; }

        .patients-page .clinical-section {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }

        .patients-page .clinical-section h3 {
            margin: 0 0 10px;
            color: var(--color-primary-dark);
            font-size: 16px;
        }

        .patients-page .file-list,
        .patients-page .clinical-history-list {
            display: grid;
            gap: 10px;
        }

        .patients-page .file-row,
        .patients-page .clinical-note-card {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: #fff;
        }

        .patients-page .clinical-note-card { grid-template-columns: 1fr; background: rgba(244, 248, 251, 0.86); }
        .patients-page .clinical-note-card header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: var(--color-text-muted); font-size: 13px; font-weight: 800; }
        .patients-page .clinical-note-card p { margin-top: 7px; color: var(--color-text); line-height: 1.45; }

        .patients-page .file-row strong,
        .patients-page .file-row span { display: block; overflow-wrap: anywhere; }
        .patients-page .file-row span { margin-top: 4px; color: var(--color-text-muted); font-size: 13px; }
        .patients-page .file-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .patients-page .file-download { background: var(--color-primary); }
        .patients-page .file-view { background: var(--color-secondary); }
        .patients-page .file-delete { background: var(--color-error); }

        .patients-page .preview-dialog {
            width: min(1100px, 100%);
            height: min(780px, calc(100vh - 36px));
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            overflow: hidden;
            border-radius: var(--radius-lg);
        }

        .patients-page .preview-header h3 {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .patients-page .preview-content {
            min-height: 0;
            display: grid;
            place-items: center;
            overflow: auto;
            background: #e5e7eb;
        }

        .patients-page .preview-content iframe { width: 100%; height: 100%; border: 0; background: #fff; }
        .patients-page .preview-content img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }

        @media (max-width: 1100px) {
            .patients-page .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .patients-page .form-grid textarea { grid-column: span 2; }
        }

        @media (max-width: 760px) {
            .patients-page .main { padding: 18px 14px; }
            .patients-page .topbar { align-items: flex-start; flex-direction: column; }
            .patients-page .form-grid,
            .patients-page .patient-meta,
            .patients-page .upload-panel,
            .patients-page .file-row { grid-template-columns: 1fr; }
            .patients-page .form-grid textarea,
            .patients-page .upload-panel input[type="file"],
            .patients-page .upload-panel .add-btn { grid-column: 1; }
            .patients-page .patient-grid { grid-template-columns: 1fr; }
            .patients-page .clinical-dialog { max-height: calc(100vh - 24px); }
            .patients-page .clinical-info-grid,
            .patients-page .clinical-note-form { grid-template-columns: 1fr; }
            .patients-page .clinical-note-form .span-2 { grid-column: auto; }
        }
    </style>

    <link rel="stylesheet" href="styles.css">

</head>

<body class="patients-page">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">

            <svg class="brand-logo"
                 viewBox="0 0 680 300"
                 xmlns="http://www.w3.org/2000/svg"
                 role="img"
                 aria-label="Angeles DentalCare">

                <g class="logo-group">

                    <g class="icon-group"
                       transform="translate(340,122)">

                        <path d="M0 -37 Q20 -50 34 -37 Q50 -22 42 6 Q32 32 18 47 Q9 56 0 47 Q-9 56 -18 47 Q-32 32 -42 6 Q-50 -22 -34 -37 Q-20 -50 0 -37 Z"
                              fill="white" />

                    </g>

                    <g class="text-main">

                        <text x="340"
                              y="208"
                              font-family="Georgia"
                              font-size="42"
                              fill="white"
                              text-anchor="middle">

                            ANGELES

                        </text>

                    </g>

                    <g class="text-sub">

                        <text x="340"
                              y="244"
                              font-family="Arial"
                              font-size="16"
                              fill="white"
                              text-anchor="middle">

                            DENTALCARE

                        </text>

                    </g>

                </g>

            </svg>

        </div>

        <div class="menu">

            <button data-nav="dashboard" onclick="irDashboard()">
                <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                Dashboard
            </button>

            <button data-nav="pacientes" class="active" onclick="irPacientes()">
                <i class="fa-solid fa-user-group" aria-hidden="true"></i>
                Pacientes
            </button>

            <button data-nav="citas" onclick="irCitas()">
                <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
                Citas
            </button>

            <button data-nav="reportes" onclick="irReportes()">
                <i class="fa-solid fa-chart-column" aria-hidden="true"></i>
                Reportes
            </button>

        </div>

    </div>

    <!-- MAIN -->

    <div class="main">

        <div class="topbar">

            <h1 id="pacientesTitle">
                Gestión de Pacientes
            </h1>

            <button class="logout-btn"
                    onclick="cerrarSesion()">

                Cerrar Sesión

            </button>

        </div>

        <!-- FORM -->

        <div class="role-note" id="roleNote"></div>

        <div class="form-box" id="pacienteForm">

            <h2>
                Registrar Paciente
            </h2>

            <div class="form-grid">

                <input type="text"
                       id="nombre"
                       placeholder="Nombre completo">

                <input type="text"
                       id="cedula"
                       placeholder="Cédula de identidad">

                <input type="text"
                       id="codigoPaciente"
                       placeholder="Código del paciente (opcional)">

                <input type="tel"
                       id="telefono"
                       placeholder="Teléfono">

                <input type="email"
                       id="email"
                       placeholder="Correo electrónico">

                <select id="doctorAsignado">
                    <option value="">Sin doctor asignado por ahora</option>
                </select>

                <select id="tipoPaciente" onchange="toggleAmbulatoryFields()">
                    <option value="regular">Paciente regular</option>
                    <option value="ambulatory">Paciente ambulatorio</option>
                </select>

                <div class="form-grid span-2" id="ambulatoryFields" hidden>
                    <input type="date" id="ambulatoryDate" aria-label="Fecha de atención ambulatoria">
                    <input type="time" id="ambulatoryTime" aria-label="Hora de atención ambulatoria">
                    <input type="text" id="ambulatoryProcedure" maxlength="160" placeholder="Procedimiento realizado">
                    <textarea id="ambulatoryObservations" placeholder="Observaciones ambulatorias"></textarea>
                </div>

                <textarea id="notas"
                          placeholder="Notas generales, alergias o información importante"></textarea>

                <textarea id="alergias"
                          placeholder="Alergias conocidas"></textarea>

                <textarea id="antecedentesMedicos"
                          placeholder="Antecedentes médicos relevantes"></textarea>

                <textarea id="medicamentosActuales"
                          placeholder="Medicamentos actuales"></textarea>

                <textarea id="motivoConsulta"
                          placeholder="Motivo de consulta"></textarea>

            </div>

            <button class="add-btn"
                    onclick="agregarPaciente()">

                Registrar Paciente

            </button>

        </div>

        <!-- SEARCH -->

        <div class="search-box">

            <input type="text"
                   id="busqueda"
                   placeholder="Buscar paciente por nombre, cédula o código..."
                   onkeyup="renderPacientes()">

        </div>

        <!-- GRID -->

        <div class="patient-grid"
             id="patientGrid">

        </div>

    </div>

    <div class="clinical-backdrop" id="clinicalModal" hidden>
        <section class="clinical-dialog" role="dialog" aria-modal="true" aria-labelledby="clinicalTitle">

    <script src="api.js?v=20260626e"></script>

    <script src="dental-tooth-selector.js?v=20260903a"></script>

    <script type="text/plain" data-dental-page='{"active":"pacientes"}'>

        /* STORAGE */


        let pacientes =
            JSON.parse(
                localStorage.getItem("pacientes")
            ) || [];

        let apiActiva = !!DentalApi.getToken();
        let rol = DentalRoles.rol;
        let doctorActual = DentalRoles.doctor;
        let doctores = [];
        let pacienteExpediente = null;
        let archivosExpediente = [];
        let notasClinicas = [];
        let odontogramCurrent = { teeth: {} };
        let odontogramOpening = Promise.resolve();
        let odontogramLoaded = false;
        let selectedOdontogramToothId = "";
        let previewObjectUrl = "";
        const clinicalToothSelector = DentalToothSelector.createSelector({
            gridId: "clinicalToothGrid",
            countModeId: "clinicalToothCountMode",
            numberingSystemId: "clinicalToothNumberingSystem",
            hiddenInputId: "clinicalToothNumber",
            toggleFunctionName: "toggleClinicalTooth"
        });
        const ODONTOGRAM_EXISTING_CONDITIONS = [
            { code: "CARIES", label: "Caries" },
            { code: "RESTORATION", label: "Restauración existente" },
            { code: "CROWN", label: "Corona" },
            { code: "BRIDGE", label: "Puente" },
            { code: "IMPLANT", label: "Implante" },
            { code: "MISSING", label: "Ausente" },
            { code: "FRACTURE", label: "Fractura" },
            { code: "SEALANT", label: "Sellante" },
            { code: "ROOT_CANAL", label: "Endodoncia existente" },
            { code: "PROSTHESIS", label: "Prótesis" }
        ];
        const ODONTOGRAM_DIAGNOSES = [
            { code: "CARIES_ACTIVE", label: "Caries activa" },
            { code: "PULPITIS", label: "Pulpitis" },
            { code: "PULP_NECROSIS", label: "Necrosis pulpar" },
            { code: "PERIAPICAL_LESION", label: "Lesión periapical" },
            { code: "GINGIVITIS", label: "Gingivitis" },
            { code: "PERIODONTITIS", label: "Periodontitis" },
            { code: "TOOTH_FRACTURE", label: "Fractura dental" },
            { code: "TOOTH_WEAR", label: "Desgaste dental" },
            { code: "SENSITIVITY", label: "Sensibilidad dental" },
            { code: "IMPACTED_TOOTH", label: "Diente impactado" },
            { code: "RETAINED_ROOT", label: "Resto radicular" },
            { code: "MALOCCLUSION", label: "Maloclusión" },
            { code: "OTHER", label: "Otro" }
        ];
        const ODONTOGRAM_FULL_TOOTH_CONDITIONS = new Set(["MISSING", "IMPLANT", "CROWN", "PROSTHESIS"]);
        const ODONTOGRAM_SURFACES = [
            { value: "", label: "Pieza completa" },
            { value: "MESIAL", label: "Mesial" },
            { value: "DISTAL", label: "Distal" },
            { value: "BUCCAL", label: "Bucal/Vestibular" },
            { value: "LINGUAL", label: "Lingual" },
            { value: "PALATAL", label: "Palatina" },
            { value: "OCCLUSAL", label: "Oclusal" },
            { value: "INCISAL", label: "Incisal" }
        ];

        async function cargarDoctores() {
            if (!apiActiva || rol === "doctor") {
                return;
            }

            try {
                doctores = await DentalApi.getDoctors();
                const select = document.getElementById("doctorAsignado");
                select.innerHTML = '<option value="">Sin doctor asignado por ahora</option>' +
                    doctores.map(doctor => `
                        <option value="${DentalRoles.escapeHtml(doctor.id)}">
                            ${DentalRoles.escapeHtml(doctor.name)}
                        </option>
                    `).join("");
            }
            catch (error) {
                DentalRoles.notify("No se pudo cargar la lista de doctores.", "error");
            }
        }

        async function cargarPacientes() {
            if (!apiActiva) {
                renderPacientes();
                return;
            }

            try {
                pacientes = await DentalApi.getPatients();
                localStorage.setItem("pacientes", JSON.stringify(pacientes));
            }
            catch (error) {
                pacientes = [];
                DentalRoles.notify("No se pudo cargar pacientes desde el servidor.", "error");
            }

            renderPacientes();
        }

        function limpiarFormularioPaciente() {
            document.getElementById("nombre").value = "";
            document.getElementById("cedula").value = "";
            document.getElementById("codigoPaciente").value = "";
            document.getElementById("telefono").value = "";
            document.getElementById("email").value = "";
            document.getElementById("notas").value = "";
            document.getElementById("alergias").value = "";
            document.getElementById("antecedentesMedicos").value = "";
            document.getElementById("medicamentosActuales").value = "";
            document.getElementById("motivoConsulta").value = "";
            document.getElementById("doctorAsignado").value = "";
        }

        function aplicarRolesPacientes() {

            let title = document.getElementById("pacientesTitle");
            let form = document.getElementById("pacienteForm");
            let note = document.getElementById("roleNote");

            if (rol === "doctor") {
                title.innerText = "Pacientes de la clínica";
                form.style.display = "none";
                note.innerText = "Vista médica: puede consultar todos los pacientes e identificar los asignados a " + doctorActual + ".";
            }
            else if (rol === "recepcion") {
                title.innerText = "Pacientes - Recepci\u00f3n";
                note.innerText = "Recepci\u00f3n: puede registrar pacientes y gestionar sus citas.";
            }
            else {
                title.innerText = "Gesti\u00f3n de Pacientes";
                note.innerText = "Administraci\u00f3n: vista completa de pacientes.";
            }

        }

        function pacientesVisibles() {

            return pacientes
                .map((paciente, index) => ({
                    paciente: paciente,
                    index: index
                }))
                .filter(item => {
                    const filtro = new URLSearchParams(window.location.search).get("filtro");
                    return filtro !== "sin-notas" || !(item.paciente.notes || "").trim();
                });

        }

        /* AGREGAR */

        async function agregarPaciente() {

            if (rol === "doctor") {
                DentalRoles.notify("Los doctores no pueden registrar pacientes desde esta pantalla.", "warning");
                return;
            }

            let nombre = document.getElementById("nombre").value.trim();
            let cedula = document.getElementById("cedula").value.trim();
            let codigoPaciente = document.getElementById("codigoPaciente").value.trim();
            let telefono = document.getElementById("telefono").value.trim();
            let email = document.getElementById("email").value.trim();
            let notas = document.getElementById("notas").value.trim();
            let alergias = document.getElementById("alergias").value.trim();
            let antecedentesMedicos = document.getElementById("antecedentesMedicos").value.trim();
            let medicamentosActuales = document.getElementById("medicamentosActuales").value.trim();
            let motivoConsulta = document.getElementById("motivoConsulta").value.trim();
            let doctorId = document.getElementById("doctorAsignado").value;
            let patientType = document.getElementById("tipoPaciente").value;
            let appointmentDate = document.getElementById("ambulatoryDate").value;
            let appointmentTime = document.getElementById("ambulatoryTime").value;
            let procedureName = document.getElementById("ambulatoryProcedure").value.trim();
            let ambulatoryObservations = document.getElementById("ambulatoryObservations").value.trim();

            if (!nombre) {
                DentalRoles.notify("Escribe el nombre del paciente.", "warning");
                return;
            }

            const pacienteDuplicado = pacientes.some(item =>
                DentalRoles.normalizeText(item.nombre) === DentalRoles.normalizeText(nombre) &&
                (!telefono || !item.phone || item.phone === telefono)
            );

            if (pacienteDuplicado) {
                DentalRoles.notify("Ya existe una ficha similar para ese paciente.", "warning");
                return;
            }

            if (apiActiva) {
                try {
                    await DentalApi.createPatient({
                        nombre,
                        nationalId: cedula,
                        patientCode: codigoPaciente,
                        phone: telefono,
                        email,
                        notes: notas,
                        allergies: alergias,
                        medicalHistory: antecedentesMedicos,
                        currentMedications: medicamentosActuales,
                        chiefComplaint: motivoConsulta,
                        doctorId
                    });

                    await cargarPacientes();
                    limpiarFormularioPaciente();
                    DentalRoles.notify("Paciente registrado correctamente.", "success");
                    return;
                }
                catch (error) {
                    DentalRoles.notify(error.message || "No se pudo registrar el paciente.", "error");
                    return;
                }
            }

            let paciente = {

                nombre: nombre,
                national_id: cedula,
                patient_code: codigoPaciente,
                phone: telefono,
                email: email,
                notes: notas,
                allergies: alergias,
                medical_history: antecedentesMedicos,
                current_medications: medicamentosActuales,
                diagnosis: motivoConsulta,
                motivo_consulta: motivoConsulta,
                patient_type: patientType,
                procedure_name: procedureName,
                appointment_date: appointmentDate,
                appointment_time: appointmentTime

            };

            pacientes.push(
                paciente
            );

            localStorage.setItem(
                "pacientes",
                JSON.stringify(pacientes)
            );

            aplicarRolesPacientes();

        renderPacientes();
            limpiarFormularioPaciente();

            DentalRoles.notify("Paciente registrado correctamente.", "success");

        }

        /* RENDER */

        function estadoClase(estado) {
            return DentalRoles.normalizeText(estado).replace(/\s+/g, "-");
        }

        function pacienteEsDelDoctor(paciente) {
            return !!paciente.is_assigned_to_current_doctor || DentalRoles.sameDoctor(paciente.doctor, doctorActual);
        }

        function pacienteFueAtendidoPorDoctor(paciente) {
            return !!paciente.has_attended_current_doctor;
        }

        function renderPacientes() {

            let grid =
                document.getElementById(
                    "patientGrid"
                );

            let busqueda =
                document.getElementById(
                    "busqueda"
                ).value.toLowerCase();

            grid.innerHTML = "";

            let visibles = pacientesVisibles()
                .filter(item => {
                    const p = item.paciente;
                    const searchable = [
                        p.nombre,
                        p.national_id,
                        p.patient_code,
                        p.phone,
                        p.doctor
                    ].join(" ").toLowerCase();
                    return searchable.includes(busqueda);
                });

            if (visibles.length === 0) {
                grid.innerHTML = `<div class='empty-state'>${busqueda ? "No hay pacientes que coincidan con la búsqueda actual." : "No hay pacientes para mostrar."}</div>`;
                return;
            }

            visibles.forEach(item => {

                let p = item.paciente;
                let index = item.index;
                let deleteButton = rol === "doctor" ? "" : `
                    <button class="delete-btn" onclick="eliminar(${index})">
                        Eliminar
                    </button>
                `;
                let assignButton = rol === "doctor" ? "" : `
                    <button class="assign-btn" onclick="asignarDoctor(${index})">
                        ${p.doctor ? "Cambiar doctor" : "Asignar doctor"}
                    </button>
                `;
                let esPacienteDelDoctor = rol === "doctor" && pacienteEsDelDoctor(p);
                let fueAtendidoPorDoctor = rol === "doctor" && pacienteFueAtendidoPorDoctor(p);
                let ownershipBadge = rol === "doctor"
                    ? `<span class="patient-badge ${esPacienteDelDoctor ? "mine" : "neutral"}">${esPacienteDelDoctor ? "Mi paciente" : (fueAtendidoPorDoctor ? "Visita atendida" : "Paciente general")}</span>`
                    : "";
                let identityBadge = p.patient_code
                    ? `<span class="patient-badge neutral">${DentalRoles.escapeHtml(p.patient_code)}</span>`
                    : "";
                let typeBadge = `<span class="patient-badge ${p.patient_type === "ambulatory" ? "ambulatory" : "regular"}">${p.patient_type === "ambulatory" ? "Ambulatorio" : "Regular"}</span>`;
                let takeButton = rol === "doctor" && !esPacienteDelDoctor ? `
                    <button class="assign-btn" onclick="tomarPaciente(${index})">
                        Atender visita
                    </button>
                ` : "";
                let followButton = rol === "doctor" && !esPacienteDelDoctor && !p.doctor_id ? `
                    <button class="complete-btn" onclick="asignarPacienteSeguimiento(${index})">
                        Asignar a mi seguimiento
                    </button>
                ` : "";
                let clinicalButton = rol === "recepcion" ? "" : `
                    <button class="file-btn" onclick="abrirExpediente(${index})" ${rol === "doctor" && !esPacienteDelDoctor && !fueAtendidoPorDoctor ? "disabled title=\"Atiende la visita antes de abrir el expediente\"" : ""}>
                        Expediente (${Number(p.file_count || 0)})
                    </button>
                `;
                grid.innerHTML += `

            <article class="patient-card">

                <header>
                    <div class="patient-title">
                        <h3 title="${DentalRoles.escapeHtml(p.nombre)}">
                            ${DentalRoles.escapeHtml(p.nombre)}
                        </h3>
                    </div>
                    <div class="patient-badges">
                        ${ownershipBadge}
                        ${identityBadge}
                        ${typeBadge}
                    </div>
                </header>

                <div class="patient-meta">
                    <div class="meta-item">
                        <span class="meta-label">Cédula</span>
                        <span class="meta-value" title="${DentalRoles.escapeHtml(p.national_id || "No registrada")}">${DentalRoles.escapeHtml(p.national_id || "No registrada")}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Teléfono</span>
                        <span class="meta-value" title="${DentalRoles.escapeHtml(p.phone || "No registrado")}">${DentalRoles.escapeHtml(p.phone || "No registrado")}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Correo</span>
                        <span class="meta-value" title="${DentalRoles.escapeHtml(p.email || "No registrado")}">${DentalRoles.escapeHtml(p.email || "No registrado")}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Doctor</span>
                        <span class="meta-value" title="${DentalRoles.escapeHtml(p.doctor || "Sin asignar")}">${DentalRoles.escapeHtml(p.doctor || "Sin asignar")}</span>
                    </div>
                </div>

                <div class="actions">

                    <button class="view-btn" onclick="verDetallePaciente(${index})" title="Ver detalle del paciente">
                        Ver detalle
                    </button>

                    ${clinicalButton}
                    ${rol !== "recepcion" ? `<button class="assign-btn" onclick="abrirClasificacionPaciente(${index})">Clasificación</button>` : ""}
                    ${rol !== "recepcion" ? `<button class="file-btn" onclick="abrirCondicionesMedicas(${index})">Alertas clínicas</button>` : ""}
                    ${rol !== "doctor" && p.patient_type === "ambulatory" ? `<button class="complete-btn" onclick="convertirPacienteRegular(${index})">Convertir a regular</button>` : ""}
                    ${takeButton}
                    ${followButton}
                    ${assignButton}
                    ${deleteButton}

                </div>

            </article>

            `;

            });

        }



        function toggleAmbulatoryFields() {
            const isAmbulatory = document.getElementById("tipoPaciente")?.value === "ambulatory";
            const fields = document.getElementById("ambulatoryFields");
            if (fields) fields.hidden = !isAmbulatory;
        }

        function clinicalToothSelections() {
            return clinicalToothSelector.selections();
        }

        function renderClinicalToothSelector() {
            clinicalToothSelector.render();
        }

        function toggleClinicalTooth(toothId) {
            clinicalToothSelector.toggle(toothId);
        }

        function clinicalToothCountIsValid() {
            return clinicalToothSelector.isValid();
        }

        async function convertirPacienteRegular(index) {
            const paciente = pacientes[index];
            if (!paciente?.id) return;
            try {
                await DentalApi.updatePatientType(paciente.id, "regular");
                await cargarPacientes();
                DentalRoles.notify("Paciente convertido a regular.", "success");
            } catch (error) { DentalRoles.notify(error.message, "error"); }
        }

        function abrirClasificacionPaciente(index) {
            const paciente = pacientes[index];
            if (!paciente?.id) return;
            const backdrop = document.createElement("div");
            const options = [
                ["sin_clasificacion", "Sin clasificación"], ["cumplido", "Cumplido"], ["impuntual", "Impuntual"],
                ["ausencias_frecuentes", "Ausencias frecuentes"], ["requiere_confirmacion", "Requiere confirmación"],

            return `${(size / (1024 * 1024)).toFixed(1)} MB`;

        function etiquetaRelacionOdontograma(entry) {
            const surface = ODONTOGRAM_SURFACES.find(item => item.value === (entry.surface || ""));

        function renderOdontogramEntry(entry) {
            const relatedType = entry.entry_type === "PROPOSED_TREATMENT" ? "DIAGNOSIS"
                : entry.entry_type === "COMPLETED_TREATMENT" ? "PROPOSED_TREATMENT" : null;
            let related = relatedType && entry.related_entry_id
                ? entradasOdontograma(selectedOdontogramToothId).find(item => item.id === entry.related_entry_id && item.entry_type === relatedType)
                : null;
            if (!related && relatedType && entry.related_entry_id) {
                const reference = odontogramCurrent?.related_entries?.[entry.related_entry_id];
                if (reference?.id === entry.related_entry_id && reference.entry_type === relatedType) related = reference;
            }
            return `
                <article class="odontogram-entry">
                    <span>${DentalRoles.escapeHtml(etiquetaEntradaOdontograma(entry.entry_type))}</span>
                    <strong>${DentalRoles.escapeHtml(entry.condition_label || "Sin condición")}</strong>
                    ${related ? `<p>${entry.entry_type === "PROPOSED_TREATMENT" ? "Relacionado con" : "Basado en propuesta"}: ${DentalRoles.escapeHtml(etiquetaRelacionOdontograma(related))}</p>` : ""}
                    ${entry.surface ? `<p><strong>Superficie:</strong> ${DentalRoles.escapeHtml(entry.surface)}</p>` : ""}
                    ${entry.status ? `<p><strong>Estado:</strong> ${DentalRoles.escapeHtml(entry.status)}</p>` : ""}
                    ${entry.notes ? `<p><strong>Notas:</strong> ${DentalRoles.escapeHtml(entry.notes)}</p>` : ""}
                    ${entry.created_at ? `<p><strong>Fecha:</strong> ${DentalRoles.escapeHtml(new Date(entry.created_at).toLocaleString("es-DO"))}</p>` : ""}
                    ${entry.id && !["VOIDED", "SUPERSEDED"].includes(entry.status) ? `
                        <div class="confirm-actions">
                            <button type="button" class="confirm-secondary" data-entry-id="${DentalRoles.escapeHtml(entry.id)}" onclick="solicitarCambioOdontograma(this.dataset.entryId, 'SUPERSEDED')">Corregir</button>
                            <button type="button" class="confirm-secondary" data-entry-id="${DentalRoles.escapeHtml(entry.id)}" onclick="solicitarCambioOdontograma(this.dataset.entryId, 'VOIDED')">Anular</button>
                        </div>
                    ` : ""}
                </article>
            `;
        }

        function solicitarCambioOdontograma(entryId, status) {
            if (document.getElementById("odontogramStatusDialog")) return;
            const entry = entradasOdontograma(selectedOdontogramToothId).find(item => item.id === entryId);
            if (!entry || !pacienteExpediente || !["VOIDED", "SUPERSEDED"].includes(status)) return;
            const patient = pacienteExpediente;
            const toothId = selectedOdontogramToothId;
            const previousFocus = document.activeElement;
            const backdrop = document.createElement("div");
            backdrop.id = "odontogramStatusDialog";
            backdrop.className = "confirm-backdrop";
            backdrop.innerHTML = `
                <form class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="odontogramStatusTitle">
                    <h3 id="odontogramStatusTitle">${status === "VOIDED" ? "Anular registro" : "Corregir registro"}</h3>
                    <p>${DentalRoles.escapeHtml(entry.condition_label)}</p>
                    ${status === "SUPERSEDED" ? '<p>El original seguirá vigente hasta que guardes la corrección.</p>' : ""}
                    <label>Motivo obligatorio<textarea name="reason" required maxlength="2000" rows="3"></textarea></label>
                    <div class="confirm-actions">
                        <button type="button" class="confirm-secondary" data-cancel>Cancelar</button>
                        <button type="submit" class="confirm-danger">${status === "VOIDED" ? "Anular" : "Continuar corrección"}</button>
                    </div>
                </form>`;
            document.body.appendChild(backdrop);
            const form = backdrop.querySelector("form");
            let saving = false;
            const close = () => { backdrop.remove(); if (previousFocus?.isConnected) previousFocus.focus(); };
            backdrop.querySelector("[data-cancel]").onclick = () => { if (!saving) close(); };
            backdrop.addEventListener("keydown", event => {
                if (event.key === "Escape" && !saving) close();
            });
            form.elements.reason.focus();
            form.onsubmit = async event => {
                event.preventDefault();
                const reason = form.elements.reason.value.trim();
                if (saving) return;
                if (!reason) { DentalRoles.notify("Escribe el motivo del cambio.", "warning"); return; }
                if (pacienteExpediente !== patient) { close(); return; }
                if (status === "SUPERSEDED") {
                    close();
                    selectedOdontogramToothId = toothId;
                    renderOdontogramView();
                    await precargarCorreccionOdontograma(entry, reason);
                    return;
                }
                saving = true;
                form.querySelector('[type="submit"]').disabled = true;
                try {
                    await DentalApi.updateOdontogramEntryStatus(entryId, status, reason);
                } catch (error) {
                    DentalRoles.notify(error.message || "No fue posible cambiar el registro.", "error");
                    saving = false;
                    form.querySelector('[type="submit"]').disabled = false;
                    return;
                }
                close();
                DentalRoles.notify(status === "VOIDED" ? "Registro anulado con motivo auditado." : "Original marcado. Completa y guarda el nuevo registro.", "success");
                if (pacienteExpediente !== patient) return;
                odontogramCurrent.teeth[toothId] = entradasOdontograma(toothId).filter(item => item.id !== entryId);
                try {
                    const current = await DentalApi.getPatientOdontogramCurrent(patient.id);
                    if (pacienteExpediente !== patient) return;
                    odontogramCurrent = current;
                } catch (error) {
                    DentalRoles.notify("El cambio se guardó, pero no se pudo refrescar el odontograma.", "warning");
                }
                if (pacienteExpediente !== patient) return;
                selectedOdontogramToothId = toothId;
                renderOdontogramView();
            };
        }

        async function precargarCorreccionOdontograma(entry, reason) {
            const set = (id, value) => { document.getElementById(id).value = value || ""; };
            let form;
            if (entry.entry_type === "EXISTING_CONDITION") {
                form = document.getElementById("odontogramConditionForm");
                set("odontogramConditionCode", entry.condition_code);
                set("odontogramSurface", entry.surface);
                set("odontogramNotes", entry.notes);
                actualizarSuperficieOdontograma();
            } else if (entry.entry_type === "DIAGNOSIS") {
                form = document.getElementById("odontogramDiagnosisForm");
                set("odontogramDiagnosisCode", ODONTOGRAM_DIAGNOSES.some(item => item.code === entry.condition_code) ? entry.condition_code : "OTHER");
                set("odontogramCustomDiagnosisLabel", entry.condition_label);
                set("odontogramDiagnosisSurface", entry.surface);
                set("odontogramDiagnosisNotes", entry.notes);
                actualizarDiagnosticoOdontograma();
            } else {
                form = document.getElementById(entry.entry_type === "PROPOSED_TREATMENT" ? "odontogramProposedForm" : "odontogramCompletedForm");
                const details = form.closest("details");
                details.open = true;
                await cargarProcedimientosOdontograma(details);
                if (!form.isConnected) return;
                form.elements.namedItem("surface").value = entry.surface || "";
                form.elements.namedItem("notes").value = entry.notes || "";
                const procedure = form.elements.namedItem("procedure_id");
                procedure.value = entry.procedure_id || "";
                if (!procedure.value) DentalRoles.notify("El procedimiento anterior no está disponible. Selecciona uno del catálogo antes de guardar.", "warning");
                const relation = form.elements.namedItem("related_entry_id");
                if (relation) relation.value = entry.related_entry_id || "";
            }
            form.odontogramCorrection = { original_entry_id: entry.id, reason };
            const cancel = document.createElement("button");
            cancel.type = "button";
            cancel.className = "confirm-secondary";
            cancel.textContent = "Cancelar corrección";
            cancel.onclick = () => { if (!form.dataset.correctionSaving) renderOdontogramView(); };
            form.appendChild(cancel);
            form.scrollIntoView({ block: "nearest" });
            form.querySelector("select")?.focus();
        }

        async function guardarEntradaOdontograma(form, payload) {
            const correction = form.odontogramCorrection;
            if (!correction) return DentalApi.createOdontogramEntry(payload);
            if (form.dataset.correctionSaving) throw new Error("La corrección ya se está guardando.");
            form.dataset.correctionSaving = "true";
            try {
                const result = await DentalApi.correctOdontogramEntry(correction.original_entry_id, correction.reason, payload);
                // Prevent retrying an already committed correction if refreshing fails.
                form.querySelectorAll('button[type="submit"]').forEach(button => { button.disabled = true; });
                DentalRoles.notify("Corrección guardada. El original se conserva en el historial.", "success");
                return result;
            } catch (error) {
                delete form.dataset.correctionSaving;
                throw error;
            }
        }

        function actualizarSuperficieOdontograma() {
            const conditionCode = document.getElementById("odontogramConditionCode")?.value || "";
            const surface = document.getElementById("odontogramSurface");
            if (!surface) return;

            if (ODONTOGRAM_FULL_TOOTH_CONDITIONS.has(conditionCode)) {
                surface.value = "";
                surface.disabled = true;
            } else {
                surface.disabled = false;
            }
        }

        function actualizarDiagnosticoOdontograma() {
            const diagnosisCode = document.getElementById("odontogramDiagnosisCode")?.value || "";
            const customGroup = document.getElementById("odontogramCustomDiagnosisGroup");
            if (!customGroup) return;
            customGroup.hidden = diagnosisCode !== "OTHER";
        }

        async function guardarCondicionOdontograma(event) {
            event.preventDefault();

            if (!apiActiva || typeof DentalApi.createOdontogramEntry !== "function") {
                DentalRoles.notify("El registro del odontograma requiere conexión con la API.", "warning");
                return;
            }

            if (!pacienteExpediente?.id || !selectedOdontogramToothId) {
                DentalRoles.notify("Selecciona una pieza dental.", "warning");
                return;
            }

            const conditionCode = document.getElementById("odontogramConditionCode").value;
            const condition = ODONTOGRAM_EXISTING_CONDITIONS.find(item => item.code === conditionCode);
            const surfaceValue = document.getElementById("odontogramSurface").value || null;
            const notes = document.getElementById("odontogramNotes").value.trim();

            if (!condition) {
                DentalRoles.notify("Selecciona una condición clínica.", "warning");
                return;
            }

            const payload = {
                patient_id: pacienteExpediente.id,
                tooth_id: selectedOdontogramToothId,
                entry_type: "EXISTING_CONDITION",
                condition_code: condition.code,
                condition_label: condition.label,
                surface: surfaceValue,
                status: "ACTIVE",
                notes
            };

            try {
                await guardarEntradaOdontograma(event.currentTarget, payload);
                DentalRoles.notify("Condición registrada en el odontograma.", "success");
                await recargarOdontogramaActual();
            }
            catch (error) {
                DentalRoles.notify(error.message || "No fue posible registrar la condición.", "error");
            }
        }

        async function guardarDiagnosticoOdontograma(event) {
            event.preventDefault();

            if (!apiActiva || typeof DentalApi.createOdontogramEntry !== "function") {
                DentalRoles.notify("El registro del odontograma requiere conexión con la API.", "warning");
                return;
            }

            const diagnosisCode = document.getElementById("odontogramDiagnosisCode").value;

                condition_label: diagnosis.code === "OTHER" ? customLabel : diagnosis.label,

        async function cargarProcedimientosOdontograma(details) {
            const form = details.querySelector("form");
            if (form.odontogramProcedures || form.dataset.loading) return;
            const select = form.elements.namedItem("procedure_id");
            const message = form.querySelector("[data-catalog-status]");
            form.dataset.loading = "true";
            message.textContent = "Cargando procedimientos...";
            try {
                if (!apiActiva) throw new Error("El catálogo requiere conexión con la API.");
                const procedures = await DentalApi.getProcedures();
                if (!form.isConnected) return;
                if (!Array.isArray(procedures)) throw new Error("La respuesta del catálogo no es válida.");
                form.odontogramProcedures = procedures.filter(item => item.id && item.name && item.active !== false);
                select.innerHTML = '<option value="">Seleccionar procedimiento</option>' + form.odontogramProcedures.map(item =>
                    `<option value="${DentalRoles.escapeHtml(item.id)}">${DentalRoles.escapeHtml(item.name)} (${DentalRoles.escapeHtml(item.category_name || "Sin área")})</option>`
                ).join("");
                select.disabled = !form.odontogramProcedures.length;
                form.querySelector('[type="submit"]').disabled = select.disabled;
                message.textContent = select.disabled ? "No hay procedimientos disponibles." : "";
            } catch (error) {
                if (!form.isConnected) return;
                select.innerHTML = '<option value="">Catálogo no disponible</option>';
                message.textContent = error.message || "No fue posible cargar los procedimientos.";
            } finally {
                delete form.dataset.loading;
            }
        }

        async function guardarTratamientoPropuestoOdontograma(event) {
            event.preventDefault();
            const form = event.currentTarget;
            if (form.dataset.saving) return;
            const patient = pacienteExpediente;
            const toothId = selectedOdontogramToothId;
            if (!apiActiva || !patient?.id || !toothId) {
                DentalRoles.notify("Selecciona una pieza y verifica la conexión con la API.", "warning");
                return;
            }
            const procedure = form.odontogramProcedures?.find(item => item.id === form.elements.namedItem("procedure_id").value);
            const surface = form.elements.namedItem("surface").value;
            if (!procedure || !ODONTOGRAM_SURFACES.some(item => item.value === surface)) {
                DentalRoles.notify("Selecciona un procedimiento y una superficie válidos.", "warning");
                return;
            }
            const payload = {
                patient_id: patient.id,
                tooth_id: toothId,
                entry_type: "PROPOSED_TREATMENT",
                related_entry_id: form.elements.namedItem("related_entry_id")?.value || null,
                procedure_id: procedure.id,
                condition_code: procedure.id,
                condition_label: procedure.name,
                surface: surface || null,
                status: "ACTIVE",
                notes: form.elements.namedItem("notes").value.trim()
            };
            if (payload.related_entry_id && !entradasOdontograma(toothId).some(entry =>
                entry.id === payload.related_entry_id && entry.entry_type === "DIAGNOSIS" && entry.status === "ACTIVE"
            )) {
                DentalRoles.notify("Selecciona un diagnóstico activo de esta pieza o deja la relación vacía.", "warning");
                return;
            }
            const button = form.querySelector('[type="submit"]');
            form.dataset.saving = "true";
            button.disabled = true;
            try {
                await guardarEntradaOdontograma(event.currentTarget, payload);
            } catch (error) {
                DentalRoles.notify(error.message || "No fue posible guardar la propuesta.", "error");
                delete form.dataset.saving;
                button.disabled = false;
                return;
            }
            DentalRoles.notify("Tratamiento propuesto registrado.", "success");
            form.reset();
            try {
                const current = await DentalApi.getPatientOdontogramCurrent(patient.id);
                if (pacienteExpediente === patient) {
                    odontogramCurrent = current;
                    renderOdontogramView();
                }
            } catch (error) {
                DentalRoles.notify("La propuesta se guardó, pero no fue posible actualizar el odontograma. Vuelve a abrir el expediente para consultarla.", "warning");
            } finally {
                delete form.dataset.saving;
                button.disabled = false;
            }
        }

                    `).join("")
                    : '<div class="empty-state">Este paciente todavía no tiene archivos clínicos.</div>';
            }
            catch (error) {
                list.innerHTML = '<div class="empty-state">No fue posible cargar el expediente.</div>';
                DentalRoles.notify(error.message, "error");
            }
        }

        async function descargarArchivo(fileId) {
            const file = archivosExpediente.find(item => item.id === fileId);
            try {
                await DentalApi.downloadPatientFile(
                    pacienteExpediente.id,
                    fileId,
                    file?.name || "archivo"
                );
            }
            catch (error) {
                DentalRoles.notify(error.message, "error");
            }
        }

        async function verArchivo(fileId) {
            const file = archivosExpediente.find(item => item.id === fileId);
            if (!file || !pacienteExpediente) {
                return;
            }

            try {
                const preview = await DentalApi.viewPatientFile(pacienteExpediente.id, fileId);
                cerrarVistaArchivo();
                previewObjectUrl = URL.createObjectURL(preview.blob);

                const content = document.getElementById("filePreviewContent");
                document.getElementById("filePreviewTitle").textContent = file.name;

                if (preview.type.startsWith("image/")) {
                    const image = document.createElement("img");
                    image.src = previewObjectUrl;
                    image.alt = file.description || file.name;
                    content.replaceChildren(image);
                }
                else {
                    const frame = document.createElement("iframe");
                    frame.src = previewObjectUrl;
                    frame.title = file.name;
                    content.replaceChildren(frame);
                }

                document.getElementById("filePreviewModal").hidden = false;
            }
            catch (error) {
                DentalRoles.notify(error.message, "warning");
            }
        }

        function cerrarVistaArchivo() {
            document.getElementById("filePreviewModal").hidden = true;
            document.getElementById("filePreviewContent").replaceChildren();

            if (previewObjectUrl) {
                URL.revokeObjectURL(previewObjectUrl);
                previewObjectUrl = "";
            }
        }

        function eliminarArchivo(fileId) {
            DentalRoles.confirmAction({
                title: "Eliminar archivo",
                message: "El documento dejará de estar disponible en el expediente.",
                confirmText: "Eliminar",
                onConfirm: async () => {
                    try {
                        await DentalApi.deletePatientFile(pacienteExpediente.id, fileId);
                        await cargarArchivosPaciente();
                        await cargarPacientes();
                        DentalRoles.notify("Archivo eliminado.", "success");
                    }
                    catch (error) {
                        DentalRoles.notify(error.message, "error");
                    }
                }
            });
        }

        /* ACCIONES */

        async function confirmar(index) {

            if (apiActiva && pacientes[index]?.id) {
                await DentalApi.updatePatientStatus(pacientes[index].id, "Confirmada");
                await cargarPacientes();
                DentalRoles.notify("Paciente confirmado.", "success");
                return;
            }

            pacientes[index].estado =
                "Confirmada";

            localStorage.setItem(
                "pacientes",
                JSON.stringify(pacientes)
            );

            renderPacientes();
            DentalRoles.notify("Paciente confirmado.", "success");

        }

        async function completar(index) {

            if (apiActiva && pacientes[index]?.id) {
                await DentalApi.updatePatientStatus(pacientes[index].id, "Completada");
                await cargarPacientes();
                DentalRoles.notify("Paciente marcado como completado.", "success");
                return;
            }

            pacientes[index].estado =
                "Completada";

            localStorage.setItem(
                "pacientes",
                JSON.stringify(pacientes)
            );

            aplicarRolesPacientes();

        renderPacientes();
            DentalRoles.notify("Paciente marcado como completado.", "success");

        }

        function eliminar(index) {

            if (rol === "doctor") {
                DentalRoles.notify("Los doctores no pueden eliminar pacientes.", "warning");
                return;
            }

            DentalRoles.confirmAction({
                title: "Eliminar paciente",
                message: "Esta acción quitará el registro de la lista de pacientes.",
                confirmText: "Eliminar",
                onConfirm: async () => {
                    if (apiActiva && pacientes[index]?.id) {
                        await DentalApi.deletePatient(pacientes[index].id);
                        await cargarPacientes();
                        DentalRoles.notify("Paciente eliminado.", "success");
                        return;
                    }

                    pacientes.splice(index, 1);

                    localStorage.setItem(
                        "pacientes",
                        JSON.stringify(pacientes)
                    );

                    aplicarRolesPacientes();

                    renderPacientes();
                    DentalRoles.notify("Paciente eliminado.", "success");
                }
            });

        }

        function verDetallePaciente(index) {
            const paciente = pacientes[index];
            if (!paciente) {
                return;
            }

            DentalRoles.showDetails("Detalle de paciente", [
                { label: "Paciente", value: paciente.nombre },
                { label: "Cédula", value: paciente.national_id },
                { label: "Código", value: paciente.patient_code },
                { label: "Teléfono", value: paciente.phone },
                { label: "Correo", value: paciente.email },
                { label: "Doctor asignado", value: paciente.doctor },
                { label: "Próxima cita", value: paciente.fecha ? `${paciente.fecha} ${paciente.hora || ""}`.trim() : "Sin cita registrada" },
                { label: "Procedimiento", value: paciente.proceso },
                { label: "Estado", value: paciente.estado },
                { label: "Notas", value: paciente.notes },
                { label: "Alergias", value: paciente.allergies },
                { label: "Antecedentes médicos", value: paciente.medical_history },
                { label: "Medicamentos actuales", value: paciente.current_medications },
                { label: "Motivo de consulta", value: paciente.motivo_consulta || paciente.diagnosis },
            ]);
        }

        /* NAVIGATION */

        function irDashboard() {

            window.location.href =
                "dashboard.html";

        }

        function irPacientes() {

            window.location.href =
                "pacientes.html";

        }

        function irCitas() {

            window.location.href =
                "citas.html";

        }

        function irReportes() {

            window.location.href =
                "reportes.html";

        }

        /* LOGOUT */

        function cerrarSesion() {

            DentalRoles.logout();

        }

        /* INIT */

        aplicarRolesPacientes();

        if (new URLSearchParams(window.location.search).get("filtro") === "sin-notas") {
            document.getElementById("roleNote").textContent += " Mostrando pacientes sin notas registradas.";
        }

        document.getElementById("clinicalClose").addEventListener("click", cerrarExpediente);
        document.getElementById("filePreviewClose").addEventListener("click", cerrarVistaArchivo);
        document.getElementById("filePreviewModal").addEventListener("click", event => {
            if (event.target.id === "filePreviewModal") {
                cerrarVistaArchivo();
            }
        });
        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                if (!document.getElementById("filePreviewModal").hidden) {
                    cerrarVistaArchivo();
                }
                else if (!document.getElementById("clinicalModal").hidden) {
                    cerrarExpediente();
                }
            }
        });
        document.getElementById("clinicalModal").addEventListener("click", event => {
            if (event.target.id === "clinicalModal") {
                cerrarExpediente();
            }
        });
        document.getElementById("clinicalNoteForm").addEventListener("submit", async event => {
            event.preventDefault();

            if (!pacienteExpediente?.id) {
                DentalRoles.notify("Selecciona un paciente.", "warning");
                return;
            }

            const payload = {
                patientId: pacienteExpediente.id,
                noteType: document.getElementById("clinicalNoteType").value,
                consultationStatus: document.getElementById("consultationStatus").value,
                procedureName: document.getElementById("clinicalProcedureName").value,
                procedureStatus: document.getElementById("procedureStatus").value,
                toothNumber: document.getElementById("clinicalToothNumber").value,
                toothSelections: clinicalToothSelections(),
                toothCountMode: document.getElementById("clinicalToothCountMode").value,
                toothNumberingSystem: document.getElementById("clinicalToothNumberingSystem").value,
                chiefComplaint: document.getElementById("chiefComplaint").value,
                clinicalEvaluation: document.getElementById("clinicalEvaluation").value,
                odontologicalDiagnosis: document.getElementById("odontologicalDiagnosis").value,
                performedProcedures: document.getElementById("performedProcedures").value,
                indications: document.getElementById("clinicalIndications").value,
                observations: document.getElementById("clinicalObservations").value,
                medications: document.getElementById("clinicalMedications").value,
                pharmacotherapy: [{
                    drug: document.getElementById("clinicalDrug").value,
                    presentation: document.getElementById("clinicalPresentation").value,
                    dose: document.getElementById("clinicalDose").value,
                    frequency: document.getElementById("clinicalFrequency").value,
                    route: document.getElementById("clinicalRoute").value,
                    indications: document.getElementById("clinicalPharmaIndications").value
                }].filter(item => Object.values(item).some(value => (value || "").trim())),
                materialUsed: document.getElementById("materialUsed").value,
                clinicalDescription: document.getElementById("clinicalEvolutionText").value,
                clinicalFindings: document.getElementById("clinicalEvolutionText").value,
                evolution: document.getElementById("clinicalEvolutionText").value,
                nextReviewDate: document.getElementById("nextReviewDate").value,
                nextAppointmentDate: document.getElementById("nextAppointmentDate").value,
                nextAppointmentTime: document.getElementById("nextAppointmentTime").value
            };

            const hasClinicalText = [
                payload.chiefComplaint,
                payload.clinicalEvaluation,
                payload.odontologicalDiagnosis,
                payload.performedProcedures,
                payload.indications,
                payload.observations,
                payload.medications,
                ...(payload.pharmacotherapy || []).flatMap(item => Object.values(item)),
                payload.materialUsed,
                payload.evolution,
                payload.procedureName
            ].some(value => (value || "").trim());

            if (!hasClinicalText) {
                DentalRoles.notify("Registra al menos un dato clínico.", "warning");
                return;
            }

            if (!clinicalToothCountIsValid()) {
                DentalRoles.notify("La cantidad de piezas no coincide con la selección.", "warning");
                return;
            }

            try {
                await DentalApi.createClinicalNote(payload);
                event.target.reset();
                await cargarEvolucionPaciente();
                DentalRoles.notify("Evolución clínica guardada.", "success");
            }
            catch (error) {
                DentalRoles.notify(error.message, "error");
            }
        });
        document.getElementById("clinicalUploadForm").addEventListener("submit", async event => {
            event.preventDefault();
            const fileInput = document.getElementById("clinicalFile");

            if (!fileInput.files[0] || !pacienteExpediente) {
                DentalRoles.notify("Selecciona un archivo.", "warning");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("category", document.getElementById("fileCategory").value);
            formData.append("description", document.getElementById("fileDescription").value);

            try {
                await DentalApi.uploadPatientFile(pacienteExpediente.id, formData);
                event.target.reset();
                await cargarArchivosPaciente();
                await cargarPacientes();
                DentalRoles.notify("Archivo guardado en el expediente.", "success");
            }
            catch (error) {
                DentalRoles.notify(error.message, "error");
            }
        });

        Promise.all([cargarDoctores(), cargarPacientes()]).then(() => {
            const patientId = new URLSearchParams(window.location.search).get("paciente");
            const index = pacientes.findIndex(item => item.id === patientId);
            const previewMode = new URLSearchParams(window.location.search).get("preview") === "1";
            if (index >= 0 && previewMode) {
                verDetallePaciente(index);
            }
            else if (index >= 0 && rol !== "recepcion") {
                abrirExpediente(index);
            }
        });

    </script>

</body>
</html>

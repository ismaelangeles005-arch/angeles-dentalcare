<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña | MAELVEN Dental</title>
    <link rel="icon" href="/images/maelven-dental-favicon.svg" type="image/svg+xml">
    <meta name="description" content="MAELVEN Dental - Sistema de Gestión Odontológica">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
        }
        .box {
            width: min(460px, 100%);
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.24);
            border-radius: 24px;
            padding: 34px;
            color: white;
            box-shadow: 0 20px 50px rgba(15,23,42,0.24);
            backdrop-filter: blur(12px);
        }
        .logo { text-align: center; margin-bottom: 22px; }
        .logo .brand-logo { width: min(260px, 100%); height: 91px; object-fit: contain; display: block; margin: 0 auto; }
        h1 { font-size: 26px; margin-bottom: 8px; text-align: center; }
        p { line-height: 1.5; opacity: .92; text-align: center; margin-bottom: 22px; }
        .field { display: grid; gap: 8px; margin-bottom: 14px; }
        label { font-weight: 700; font-size: 14px; }
        input {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            outline: none;
        }
        .rules {
            display: grid;
            gap: 7px;
            margin: 16px 0 22px;
            padding: 14px;
            border-radius: 16px;
            background: rgba(255,255,255,0.1);
            font-size: 13px;
        }
        .rule { display: flex; align-items: center; gap: 8px; opacity: .85; }
        .rule.ok { color: #bbf7d0; opacity: 1; }
        .btn {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 14px;
            background: white;
            color: #2563eb;
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
        }
        .secondary {
            margin-top: 12px;
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.35);
        }
        .message {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
        }
        .message.show { display: block; }
        .message.error { background: rgba(220,38,38,0.22); }
        .message.success { background: rgba(22,163,74,0.22); }
    </style>
</head>
<body>
    <main class="box">
        <div class="logo">
            <img class="brand-logo" src="images/maelven-dental-logo.svg" alt="MAELVEN Dental" width="320" height="112">
        </div>
        <h1>Cambia tu contraseña</h1>
        <p>Por seguridad, debes reemplazar la contraseña temporal antes de entrar al sistema.</p>

        <form id="passwordForm">
            <div class="field">
                <label for="currentPassword">Contraseña temporal</label>
                <input type="password" id="currentPassword" autocomplete="current-password" required>
            </div>
            <div class="field">
                <label for="newPassword">Nueva contraseña</label>
                <input type="password" id="newPassword" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirmar nueva contraseña</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" required>
            </div>

            <div class="rules">
                <div class="rule" data-rule="length"><i class="fa-solid fa-circle-check"></i> Minimo 6 caracteres</div>
                <div class="rule" data-rule="letter"><i class="fa-solid fa-circle-check"></i> Al menos una letra</div>
                <div class="rule" data-rule="number"><i class="fa-solid fa-circle-check"></i> Al menos un numero</div>
            </div>

            <button class="btn" type="submit">Guardar y continuar</button>
            <button class="btn secondary" type="button" onclick="DentalRoles.logout()">Cerrar sesión</button>
            <div id="message" class="message"></div>
        </form>
    </main>

    <script src="api.js?v=20260626e"></script>
    <script src="roles.js?v=20260626e"></script>
    <script type="text/plain" data-dental-page='{"allowPasswordChange":true}'>

        const newPassword = document.getElementById("newPassword");
        const rules = {
            length: value => value.length >= 6,
            letter: value => /[A-Za-z]/.test(value),
            number: value => /[0-9]/.test(value)
        };

        function showMessage(message, type) {
            const box = document.getElementById("message");
            box.textContent = message;
            box.className = `message show ${type}`;
        }

        function validateVisual() {
            const value = newPassword.value;
            Object.entries(rules).forEach(([name, test]) => {
                document.querySelector(`[data-rule="${name}"]`).classList.toggle("ok", test(value));
            });
        }

        newPassword.addEventListener("input", validateVisual);

        document.getElementById("passwordForm").addEventListener("submit", async event => {
            event.preventDefault();
            const currentPassword = document.getElementById("currentPassword").value;
            const nextPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (nextPassword !== confirmPassword) {
                showMessage("Las contraseñas no coinciden.", "error");
                return;
            }

            if (!Object.values(rules).every(test => test(nextPassword))) {
                showMessage("La nueva contraseña no cumple las reglas de seguridad.", "error");
                return;
            }

            try {
                showMessage("Guardando nueva contraseña...", "success");
                await DentalApi.changePassword(currentPassword, nextPassword);
                window.location.href = localStorage.getItem("scope") === "PLATFORM"
                    ? "/api/platform/status"
                    : "dashboard.html";
            }
            catch (error) {
                document.getElementById("currentPassword").value = "";
                showMessage(error.message || "No se pudo cambiar la contraseña.", "error");
            }
        });
    </script>
</body>
</html>

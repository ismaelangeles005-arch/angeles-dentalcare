<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración de plataforma | MAELVEN Dental</title>
  <link rel="icon" href="images/maelven-dental-favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17212e;font:15px Arial,sans-serif;letter-spacing:0}
    header{background:white;border-bottom:1px solid #dce3e9;padding:20px 4%;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
    header img{width:190px;height:auto}header div{flex:1}h1{font-size:22px;margin:0 0 8px}h2{font-size:19px}p{line-height:1.5}
    main{max-width:1280px;margin:auto;padding:24px}button,input,select{font:inherit;min-height:42px;border:1px solid #aebbc7;border-radius:6px;padding:10px}
    button{cursor:pointer;background:white;color:#17212e}button.primary{background:#2563eb;color:white;border-color:#2563eb}button:disabled{opacity:.6;cursor:wait}
    :focus-visible{outline:3px solid #16816a;outline-offset:3px}#metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:20px 0}
    .metric{background:white;border:1px solid #dce3e9;border-radius:6px;padding:16px;overflow-wrap:anywhere}.metric strong{display:block;font-size:26px;margin-top:10px;color:#146854}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.table-scroll{overflow:auto;background:white;border:1px solid #dce3e9}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #e0e5ea;overflow-wrap:anywhere}th{background:#edf2f6;font-size:13px}
    .active{color:#146854}.inactive{color:#944126}#message{min-height:24px}#message[data-error="true"]{color:#a32929}
    dialog{border:1px solid #aebbc7;border-radius:8px;width:min(540px,calc(100% - 32px));padding:24px;max-height:90vh;overflow:auto}dialog::backdrop{background:#17212e88}
    form{display:grid;gap:14px}label{display:grid;gap:6px}form input,form select{width:100%;min-width:0}.actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
    #formError{color:#a32929;margin:0}#sessionError{padding:24px}#details{margin-top:24px;border-top:1px solid #dce3e9;overflow-wrap:anywhere}
    @media(max-width:900px){#metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:540px){main{padding:16px}#metrics{grid-template-columns:repeat(2,minmax(0,1fr))}header{gap:12px}h1{font-size:19px}}
  </style>
</head>
<body>
  <p id="sessionError" role="status">Verificando sesión...</p>
  <div id="platformApp" hidden>
    <header><img src="images/maelven-dental-logo.svg" alt="MAELVEN Dental" width="320" height="112"><div><h1>Administración de plataforma</h1><span id="identity"></span></div><button id="logout" type="button">Cerrar sesión</button></header>
    <main>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="metrics" aria-label="Resumen de organizaciones"></section>
      <section aria-labelledby="organizationsTitle"><div class="toolbar"><h2 id="organizationsTitle">Organizaciones</h2><div><button id="refresh" type="button">Actualizar</button> <button id="newOrganization" class="primary" type="button">Nueva organización</button></div></div>
        <div class="table-scroll"><table><thead><tr><th>Nombre</th><th>Tipo</th><th>Estado</th><th>Creación</th><th>Actualización</th><th>Acciones</th></tr></thead><tbody id="organizations"></tbody></table></div>
      </section>
      <section id="details" aria-label="Detalle de organización" hidden></section>
    </main>
  </div>
  <dialog id="createDialog" aria-labelledby="createTitle"><h2 id="createTitle">Nueva organización</h2>
    <form id="createForm">
      <label>Nombre de la organización<input name="organizationName" maxlength="200" required></label>
      <label>Tipo<select name="organizationType"><option value="CLINIC">Clínica</option><option value="INDEPENDENT">Profesional independiente</option></select></label>
      <label>Nombre completo del propietario<input name="fullName" maxlength="160" required autocomplete="off"></label>
      <label>Usuario inicial<input name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]{3,40}" required autocomplete="off" autocapitalize="none"></label>
      <label>Contraseña temporal<input name="password" type="password" minlength="6" maxlength="200" required autocomplete="new-password"></label>
      <p id="formError" role="alert"></p>
      <div class="actions"><button id="cancelCreate" type="button">Cancelar</button><button id="saveCreate" class="primary" type="submit">Crear organización</button></div>
    </form>
  </dialog>
  <script src="api.js?v=platform4"></script>
  <script src="platform-ui.js"></script>
</body>
</html>

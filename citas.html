<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citas - Angeles DentalCare</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <style>
        .appointments-page .main {
            flex: 1;
            min-width: 0;
            padding: 24px clamp(18px, 2.4vw, 30px);
        }

        .appointments-page .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .appointments-page .topbar h1 {
            margin: 0;
            color: var(--color-primary-dark);
            font-size: clamp(24px, 2.3vw, 34px);
            line-height: 1.1;
        }

        .appointments-page .form-box,
        .appointments-page .citas-box,
        .appointments-page .availability-box,
        .appointments-page .clinical-modal {
            border: 1px solid var(--color-border);
            background: rgba(255, 255, 255, 0.96);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .appointments-page .form-box,
        .appointments-page .citas-box,
        .appointments-page .availability-box {
            padding: 20px;
            margin-bottom: 16px;
        }

        .appointments-page .form-box h2,
        .appointments-page .citas-box h2,
        .appointments-page .availability-box h2 {
            margin: 0 0 16px;
            color: var(--color-primary-dark);
            font-size: 20px;
        }

        .appointments-page .form-grid,
        .appointments-page .clinical-fields {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .appointments-page .clinical-fields {
            grid-column: 1 / -1;
            padding-top: 4px;
            border-top: 1px solid var(--color-border);
        }

        .appointments-page .field-group {
            display: grid;
            gap: 6px;
            min-width: 0;
        }

        .appointments-page .field-group label {
            color: var(--color-primary-dark);
            font-size: 12px;
            font-weight: 900;
        }

        .appointments-page .field-help {
            color: var(--color-text-muted);
            font-size: 12px;
        }

        .appointments-page .field-group[hidden] { display: none; }

        .appointments-page input,
        .appointments-page select,
        .appointments-page textarea {
            width: 100%;
            min-height: var(--control-height);
            padding: 10px 12px;
            border: 1px solid rgba(148, 163, 184, 0.42);
            border-radius: var(--radius-md);
            background: #fff;
            color: var(--color-text);
            font: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .appointments-page textarea {
            min-height: 86px;
            resize: vertical;
        }

        .appointments-page input:focus,
        .appointments-page select:focus,
        .appointments-page textarea:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 166, 0.12);
        }

        .appointments-page .save-btn,
        .appointments-page .secondary-btn,
        .appointments-page .action-btn {
            min-height: 38px;
            border-radius: var(--radius-md);
            padding: 9px 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 13px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .appointments-page .save-btn {
            margin-top: 16px;
            border: 0;
            background: var(--color-primary);
            color: #fff;
            box-shadow: 0 10px 22px rgba(37, 99, 166, 0.18);
        }

        .appointments-page .secondary-btn {
            border: 1px solid var(--color-border);
            background: #fff;
            color: var(--color-primary-dark);
        }

        .appointments-page .action-btn {
            border: 0;
            color: #fff;
        }

        .appointments-page .save-btn:hover,
        .appointments-page .secondary-btn:hover,
        .appointments-page .action-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.02);
        }

        .appointments-page .filters-bar {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) 210px;
            gap: 12px;
            margin-bottom: 14px;
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background: rgba(244, 248, 251, 0.72);
        }


        .appointments-page .quick-filters {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            padding: 10px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.78);
        }

        .appointments-page .quick-filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .appointments-page .quick-filter {
            min-height: 34px;
            padding: 7px 11px;
            border: 1px solid rgba(148, 163, 184, 0.36);
            border-radius: 999px;
            background: #fff;
            color: var(--color-primary-dark);
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 800;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease;
        }

        .appointments-page .quick-filter:hover,
        .appointments-page .quick-filter:focus-visible {
            border-color: rgba(37, 99, 166, 0.45);
            box-shadow: 0 0 0 4px rgba(37, 99, 166, 0.10);
            outline: none;
        }

        .appointments-page .quick-filter.active {
            border-color: var(--color-primary);
            background: var(--color-primary);
            color: #fff;
            box-shadow: 0 8px 18px rgba(37, 99, 166, 0.18);
        }

        .appointments-page .quick-filter-count {
            color: var(--color-text-muted);
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
        }
        .appointments-page #listaCitas {
            display: grid;
            gap: 12px;
        }

        .appointments-page .cita {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 14px;
            padding: 14px;
            border: 1px solid var(--color-border);
            border-left: 4px solid rgba(37, 99, 166, 0.72);
            border-radius: var(--radius-lg);
            background: #fff;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .appointments-page .cita:hover {
            transform: translateY(-2px);
            border-color: rgba(37, 99, 166, 0.34);
            box-shadow: var(--shadow-md);
        }

        .appointments-page .appointment-main {
            min-width: 0;
            display: grid;
            gap: 10px;
        }

        .appointments-page .appointment-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .appointments-page .appointment-title {
            min-width: 0;
        }

        .appointments-page .appointment-title strong {
            display: block;
            color: var(--color-primary-dark);
            font-size: 17px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .appointments-page .appointment-title span {
            display: block;
            margin-top: 3px;
            color: var(--color-text-muted);
            font-size: 13px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .appointments-page .appointment-meta {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }

        .appointments-page .meta-item {
            min-width: 0;
            padding: 9px 10px;
            border-radius: var(--radius-md);
            background: rgba(244, 248, 251, 0.92);
        }

        .appointments-page .meta-label {
            display: block;
            color: var(--color-text-muted);
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .appointments-page .meta-value {
            display: block;
            margin-top: 3px;
            color: var(--color-text);
            font-size: 13px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .appointments-page .appointment-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-content: start;
            gap: 8px;
            max-width: 340px;
        }

        .appointments-page .estado {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 26px;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .appointments-page .pendiente { background: rgba(199, 139, 43, 0.16); color: #8a5d17; }
        .appointments-page .confirmada { background: rgba(37, 99, 166, 0.14); color: var(--color-primary-dark); }
        .appointments-page .en_consulta { background: rgba(47, 167, 160, 0.16); color: #176b66; }
        .appointments-page .completada { background: rgba(46, 139, 114, 0.16); color: #17624e; }
        .appointments-page .cancelada { background: rgba(200, 75, 75, 0.16); color: #9b2d2d; }
        .appointments-page .no_asistio { background: rgba(100, 116, 139, 0.14); color: #475569; }
        .appointments-page .reprogramada { background: rgba(37, 99, 166, 0.10); color: #31577a; }

        .appointments-page .complete-btn { background: var(--color-success); }
        .appointments-page .confirm-btn,
        .appointments-page .view-btn { background: var(--color-primary); }
        .appointments-page .cancel-btn { background: var(--color-error); }
        .appointments-page .delete-btn,
        .appointments-page .missed-btn { background: #475569; }
        .appointments-page .clinical-btn { background: var(--color-secondary); }
        .appointments-page .reschedule-btn { background: #6b7280; }

        .appointments-page .availability-list {
            display: grid;
            gap: 10px;
            margin-top: 14px;
        }

        .appointments-page .availability-item,
        .appointments-page .clinical-note-item {
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: rgba(244, 248, 251, 0.86);
        }

        .appointments-page .availability-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
        }

        .appointments-page .availability-item p {
            margin-top: 4px;
            color: var(--color-text-muted);
        }

        .appointments-page .clinical-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(15, 23, 42, 0.56);
        }

        .appointments-page .clinical-modal-backdrop.open { display: flex; }

        .appointments-page .clinical-modal {
            width: min(980px, 100%);
            max-height: min(720px, calc(100vh - 36px));
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            overflow: hidden;
        }

        .appointments-page .clinical-modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--color-border);
            background: rgba(255,255,255,0.98);
        }

        .appointments-page .clinical-modal-header h2 {
            margin: 0 0 4px;
            color: var(--color-primary-dark);
        }

        .appointments-page .clinical-modal-header p {
            margin: 0;
            color: var(--color-text-muted);
            font-weight: 700;
        }

        .appointments-page .clinical-close {
            width: 38px;
            height: 38px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: #fff;
            color: var(--color-primary-dark);
            cursor: pointer;
            font-size: 22px;
        }

        .appointments-page .clinical-modal-body {
            min-height: 0;
            overflow: auto;
            padding: 18px 20px 20px;
        }

        .appointments-page .clinical-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        .appointments-page .clinical-history {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }

        .appointments-page .clinical-note-item { margin-top: 10px; }
        .appointments-page .clinical-note-item small { display: block; margin-bottom: 8px; color: var(--color-text-muted); font-weight: 900; }

        @media (max-width: 1180px) {
            .appointments-page .form-grid,
            .appointments-page .clinical-fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .appointments-page .appointment-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 900px) {
            .appointments-page .main { padding: 18px 14px; }
            .appointments-page .topbar { align-items: flex-start; flex-direction: column; }
            .appointments-page .form-grid,
            .appointments-page .clinical-fields,
            .appointments-page .filters-bar,
            .appointments-page .quick-filters,
            .appointments-page .appointment-meta,
            .appointments-page .availability-item { grid-template-columns: 1fr; }
            .appointments-page .cita { grid-template-columns: 1fr; }
            .appointments-page .appointment-actions { justify-content: flex-start; max-width: none; }
            .appointments-page .clinical-modal { max-height: calc(100vh - 24px); }
        }
    </style>

    <link rel="stylesheet" href="styles.css">

</head>

<body class="appointments-page">

    <div class="sidebar">

        <div class="logo">

            <svg class="brand-logo"
                 viewBox="0 0 680 300"
                 xmlns="http://www.w3.org/2000/svg"
                 role="img"
                 aria-label="Angeles DentalCare">

                <g class="logo-group">

                    <g class="icon-group"
                       transform="translate(340,122)">

                        <path d="M0 -37 Q20 -50 34 -37 Q50 -22 42 6 Q32 32 18 47 Q9 56 0 47 Q-9 56 -18 47 Q-32 32 -42 6 Q-50 -22 -34 -37 Q-20 -50 0 -37 Z"
                              fill="white" />

                    </g>

                    <g class="text-main">

                        <text x="340"
                              y="208"
                              font-family="Georgia"
                              font-size="42"
                              fill="white"
                              text-anchor="middle">

                            ANGELES

                        </text>

                    </g>

                    <g class="text-sub">

                        <text x="340"
                              y="244"
                              font-family="Arial"
                              font-size="16"
                              fill="white"
                              text-anchor="middle">

                            DENTALCARE

                        </text>

                    </g>

                </g>

            </svg>

        </div>

        <div class="menu">

            <button data-nav="dashboard" onclick="irDashboard()">
                <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                Dashboard
            </button>

            <button data-nav="pacientes" onclick="irPacientes()">
                <i class="fa-solid fa-user-group" aria-hidden="true"></i>
                Pacientes
            </button>

            <button data-nav="citas" class="active" onclick="irCitas()">
                <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
                Citas
            </button>

            <button data-nav="reportes" onclick="irReportes()">
                <i class="fa-solid fa-chart-column" aria-hidden="true"></i>
                Reportes
            </button>

        </div>

    </div>

    <div class="main">

        <div class="topbar">

            <h1 id="citasTitle">Gestión de Citas</h1>

            <button class="logout-btn" onclick="cerrarSesion()">
                Cerrar Sesión
            </button>

        </div>

        <div class="role-note" id="roleNote"></div>

        <div class="form-box" id="citaForm">

            <h2>Nueva Cita</h2>

            <div class="form-grid">

                <div class="field-group">
                    <label for="paciente">Paciente registrado</label>
                    <input type="text"
                           id="paciente"
                           list="pacientesSugeridos"
                           autocomplete="off"
                           placeholder="Escribe para buscar un paciente">
                    <datalist id="pacientesSugeridos"></datalist>
                </div>

                <div class="field-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha">
                </div>

                <div class="field-group">
                    <label for="hora">Hora</label>
                    <input type="time" id="hora">
                </div>

                <div class="field-group">
                    <label for="duracion">Duración</label>
                    <select id="duracion">
                        <option value="30">30 minutos</option>
                        <option value="15">15 minutos</option>
                        <option value="45">45 minutos</option>
                        <option value="60">1 hora</option>
                        <option value="90">1 hora 30 minutos</option>
                        <option value="120">2 horas</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="doctor">Doctor</label>
                    <select id="doctor">
                        <option value="">Seleccionar doctor</option>
                        <option>Dra. Martínez</option>
                        <option>Dr. Gómez</option>
                        <option>Dra. Fernández</option>
                    </select>
                </div>

                <div class="clinical-fields">
                    <div class="field-group">
                        <label for="categoriaProcedimiento">Área clínica</label>
                        <select id="categoriaProcedimiento" onchange="actualizarProcedimientos()">
                            <option value="">Seleccionar área</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <label for="procedimiento">Procedimiento</label>
                        <select id="procedimiento" onchange="actualizarPiezaDental()" disabled>
                            <option value="">Seleccionar procedimiento</option>
                        </select>
                    </div>

                    <div class="field-group" id="piezaDentalGroup" hidden>
                        <label for="piezaDental">Pieza dental (FDI)</label>
                        <select id="piezaDental">
                            <option value="">Seleccionar pieza</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <label for="detalleClinico">Detalle clínico</label>
                        <input type="text" id="detalleClinico" maxlength="500"
                               placeholder="Observación breve para preparar la cita">
                    </div>
                </div>

            </div>

            <button class="save-btn" onclick="agregarCita()">
                Guardar Cita
            </button>

        </div>

        <div class="availability-box" id="availabilityBox">
            <h2>Disponibilidad médica</h2>
            <div class="form-grid">
                <div class="field-group" id="availabilityDoctorGroup">
                    <label for="availabilityDoctor">Doctor</label>
                    <select id="availabilityDoctor">
                        <option value="">Seleccionar doctor</option>
                    </select>
                </div>
                <div class="field-group">
                    <label for="availabilityDate">Fecha</label>
                    <input type="date" id="availabilityDate">
                </div>
                <div class="field-group">
                    <label for="availabilityStatus">Aviso</label>
                    <select id="availabilityStatus" onchange="toggleAvailabilityLimit()">
                        <option value="libre">Día libre</option>
                        <option value="limitado">Día limitado</option>
                    </select>
                </div>
                <div class="field-group" id="availabilityLimitGroup" hidden>
                    <label for="availabilityLimit">Máximo de pacientes</label>
                    <input type="number" id="availabilityLimit" min="1" max="50" value="1">
                </div>
                <div class="field-group">
                    <label for="availabilityNote">Nota</label>
                    <input type="text" id="availabilityNote" maxlength="300" placeholder="Motivo o instrucción interna">
                </div>
            </div>
            <button class="save-btn" onclick="guardarDisponibilidad()">Guardar aviso</button>
            <div class="availability-list" id="availabilityList">
                <div class="empty-state">Cargando disponibilidad...</div>
            </div>
        </div>

        <div class="citas-box">

            <h2>Lista de Citas</h2>

            <div class="filters-bar">
                <input type="text" id="busquedaCita" placeholder="Buscar paciente o doctor" oninput="renderCitas()">
                <select id="estadoFiltro" onchange="renderCitas()">
                    <option value="">Todos los estados</option>
                    <option value="pendiente">Pendientes</option>
                    <option value="confirmada">Confirmadas</option>
                    <option value="en_consulta">En consulta</option>
                    <option value="completada">Completadas</option>
                    <option value="cancelada">Canceladas</option>
                    <option value="no_asistio">No asistió</option>
                    <option value="reprogramada">Reprogramadas</option>
                </select>
            </div>

            <div class="quick-filters" aria-label="Filtros rápidos de citas">
                <div class="quick-filter-buttons">
                    <button type="button" class="quick-filter active" data-quick-filter="todas" aria-pressed="true" onclick="setQuickFilter('todas')">Todas</button>
                    <button type="button" class="quick-filter" data-quick-filter="hoy" aria-pressed="false" onclick="setQuickFilter('hoy')">Hoy</button>
                    <button type="button" class="quick-filter" data-quick-filter="manana" aria-pressed="false" onclick="setQuickFilter('manana')">Mañana</button>
                    <button type="button" class="quick-filter" data-quick-filter="pendientes" aria-pressed="false" onclick="setQuickFilter('pendientes')">Pendientes</button>
                    <button type="button" class="quick-filter" data-quick-filter="confirmadas" aria-pressed="false" onclick="setQuickFilter('confirmadas')">Confirmadas</button>
                </div>
                <span class="quick-filter-count" id="quickFilterCount">0 resultados</span>
            </div>
            <div id="listaCitas"></div>

        </div>

    </div>

    <div class="clinical-modal-backdrop" id="clinicalEvolutionModal">
        <div class="clinical-modal" role="dialog" aria-modal="true" aria-labelledby="clinicalEvolutionTitle">
            <div class="clinical-modal-header">
                <div>
                    <h2 id="clinicalEvolutionTitle">Evolución clínica</h2>
                    <p id="clinicalEvolutionSubtitle">Registra lo realizado en la consulta.</p>
                </div>
                <button type="button" class="clinical-close" onclick="cerrarEvolucionClinica()" aria-label="Cerrar">&times;</button>
            </div>
            <div class="clinical-modal-body">
                <input type="hidden" id="clinicalCitaIndex">
                <div class="form-grid">
                    <div class="field-group">
                        <label for="clinicalProcedure">Procedimiento realizado</label>
                        <input type="text" id="clinicalProcedure" maxlength="160">
                    </div>
                    <div class="field-group">
                        <label for="clinicalDiagnosis">Diagnóstico</label>
                        <textarea id="clinicalDiagnosis" maxlength="1000" placeholder="Diagnóstico clínico principal"></textarea>
                    </div>
                    <div class="field-group">
                        <label for="clinicalTreatment">Tratamiento realizado</label>
                        <textarea id="clinicalTreatment" maxlength="2000" placeholder="Describe el procedimiento realizado"></textarea>
                    </div>
                    <div class="field-group">
                        <label for="clinicalPrescription">Receta o indicaciones</label>
                        <textarea id="clinicalPrescription" maxlength="2000" placeholder="Medicamentos, cuidados o restricciones"></textarea>
                    </div>
                    <div class="field-group">
                        <label for="clinicalNextSteps">Próxima indicación</label>
                        <textarea id="clinicalNextSteps" maxlength="1000" placeholder="Seguimiento, control o próxima cita sugerida"></textarea>
                    </div>
                    <div class="field-group">
                        <label for="clinicalNote">Nota médica</label>
                        <textarea id="clinicalNote" maxlength="3000" placeholder="Resumen clínico de la visita"></textarea>
                    </div>
                </div>
                <div class="clinical-modal-actions">
                    <button type="button" class="secondary-btn" onclick="cerrarEvolucionClinica()">Cancelar</button>
                    <button type="button" class="save-btn" onclick="guardarEvolucionClinica()">Guardar evolución</button>
                </div>
                <div class="clinical-history">
                    <h3>Historial de esta cita</h3>
                    <div id="clinicalNotesList" class="empty-state">No hay evolución registrada para esta cita.</div>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js?v=20260626e"></script>
    <script src="roles.js?v=20260626e"></script>

    <script>

        DentalRoles.protectPage({ active: "citas" });

        let citas = JSON.parse(localStorage.getItem("citas")) || [];
        let doctoresApi = [];
        let pacientesDisponibles = [];
        let availabilityRules = [];
        let clinicalNotes = [];
        const ZONA_HORARIA = "America/Santo_Domingo";
        let apiActiva = !!DentalApi.getToken();
        let rol = DentalRoles.rol;
        let doctorActual = DentalRoles.doctor;
        let quickFilter = "todas";
        const filtrosUrl = new URLSearchParams(window.location.search);
        const estadosCita = {
            pendiente: "Pendiente",
            confirmada: "Confirmada",
            en_consulta: "En consulta",
            completada: "Completada",
            cancelada: "Cancelada",
            no_asistio: "No asistió",
            reprogramada: "Reprogramada"
        };
        let catalogoProcedimientos = {
            evaluacion: ["Evaluacion y diagnostico", [
                ["Consulta inicial", false], ["Evaluacion de urgencia", false],
                ["Revision de radiografias", false], ["Plan de tratamiento", false],
                ["Control postoperatorio", false]
            ]],
            prevencion: ["Prevencion", [
                ["Profilaxis dental", false], ["Aplicacion de fluor", false],
                ["Sellante de fosas y fisuras", true], ["Control de placa", false]
            ]],
            caries: ["Caries", [
                ["Evaluacion de caries", true], ["Eliminacion de caries", true],
                ["Restauracion por caries", true], ["Proteccion pulpar", true]
            ]],
            restauracion: ["Odontologia restauradora", [
                ["Resina compuesta", true], ["Incrustacion dental", true],
                ["Reconstruccion dental", true], ["Cambio de restauracion", true]
            ]],
            endodoncia: ["Endodoncia", [
                ["Evaluacion endodontica", true], ["Tratamiento de conducto", true],

            ]],
            extraccion: ["Extraccion", [
                ["Extraccion simple", true], ["Extraccion quirurgica", true],

            ortodoncia: ["Ortodoncia", [

                ["Control y ajuste de ortodoncia", false], ["Retiro de brackets", false],

            ]],
            periodoncia: ["Periodoncia", [
                ["Evaluacion periodontal", false], ["Raspado y alisado radicular", true],
                ["Curetaje periodontal", true], ["Cirugia periodontal", true],

            ]],
            protesis: ["Protesis y rehabilitacion", [

                ["Prueba o entrega de protesis", false]
            ]],
            cirugia: ["Cirugia oral", [
                ["Evaluacion quirurgica", false], ["Implante dental", true],

            estetica: ["Estetica dental", [
                ["Blanqueamiento dental", false], ["Carilla dental", true],
                ["Diseno de sonrisa", false], ["Contorneado estetico", true]
            ]],
            odontopediatria: ["Odontopediatria", [
                ["Consulta odontopediatrica", false], ["Pulpotomia", true],
                ["Pulpectomia", true], ["Corona pediatrica", true],

            ]],

            ]]

        async function cargarCatalogoClinico() {
            if (apiActiva && typeof DentalApi.getProcedures === "function") {
                try {
                    const proceduresApi = await DentalApi.getProcedures();
                    if (proceduresApi.length) {
                        catalogoProcedimientos = proceduresApi.reduce((acc, item) => {
                            if (!acc[item.category_key]) {
                                acc[item.category_key] = [item.category_name, []];
                            }
                            acc[item.category_key][1].push({
                                id: item.id,
                                name: item.name,
                                requiresTooth: item.requires_tooth,
                                duration: item.duration_minutes,
                                price: item.base_price
                            });
                            return acc;
                        }, {});
                    }
                }
                catch (error) {
                    DentalRoles.notify("No se pudo cargar el catalogo editable. Usando catalogo local.", "warning");
                }
            }

            const categorySelect = document.getElementById("categoriaProcedimiento");
            categorySelect.innerHTML = '<option value="">Seleccionar área</option>' +
                Object.entries(catalogoProcedimientos).map(([value, category]) =>
                    `<option value="${value}">${category[0]}</option>`
                ).join("");

            const toothSelect = document.getElementById("piezaDental");
            const permanentTeeth = [1, 2, 3, 4].flatMap(quadrant =>
                Array.from({ length: 8 }, (_, index) => `${quadrant}${index + 1}`)
            );
            const temporaryTeeth = [5, 6, 7, 8].flatMap(quadrant =>
                Array.from({ length: 5 }, (_, index) => `${quadrant}${index + 1}`)
            );

            toothSelect.innerHTML = '<option value="">Seleccionar pieza</option>' +
                '<optgroup label="Denticion permanente">' +
                permanentTeeth.map(tooth => `<option value="${tooth}">Pieza ${tooth}</option>`).join("") +
                '</optgroup><optgroup label="Denticion temporal">' +
                temporaryTeeth.map(tooth => `<option value="${tooth}">Pieza ${tooth}</option>`).join("") +
                "</optgroup>";
        }

        function actualizarProcedimientos() {
            const category = document.getElementById("categoriaProcedimiento").value;
            const procedureSelect = document.getElementById("procedimiento");
            const procedures = catalogoProcedimientos[category]?.[1] || [];

            procedureSelect.disabled = !category;
            procedureSelect.innerHTML = '<option value="">Seleccionar procedimiento</option>' +
                procedures.map(item => {
                    const name = Array.isArray(item) ? item[0] : item.name;
                    const requiresTooth = Array.isArray(item) ? item[1] : item.requiresTooth;
                    const duration = Array.isArray(item) ? "" : item.duration;
                    const price = Array.isArray(item) ? "" : item.price;
                    const id = Array.isArray(item) ? "" : item.id;
                    return `<option value="${DentalRoles.escapeHtml(name)}" data-procedure-id="${DentalRoles.escapeHtml(id)}" data-duration="${DentalRoles.escapeHtml(duration)}" data-price="${DentalRoles.escapeHtml(price)}" data-requires-tooth="${requiresTooth}">${DentalRoles.escapeHtml(name)}</option>`;
                }).join("");
            actualizarPiezaDental();
        }

        function actualizarPiezaDental() {
            const selected = document.getElementById("procedimiento").selectedOptions[0];
            const requiresTooth = selected?.dataset.requiresTooth === "true";
            const suggestedDuration = selected?.dataset.duration;
            if (suggestedDuration) {
                document.getElementById("duracion").value = suggestedDuration;
            }
            document.getElementById("piezaDentalGroup").hidden = !requiresTooth;
            document.getElementById("piezaDental").required = requiresTooth;

            if (!requiresTooth) {
                document.getElementById("piezaDental").value = "";
            }
        }

        async function cargarDoctoresCitas() {
            if (!apiActiva) {
                return;
            }

            try {
                doctoresApi = await DentalApi.getDoctors();
                const select = document.getElementById("doctor");
                select.innerHTML = '<option value="">Seleccionar doctor</option>';

                doctoresApi.forEach(doctor => {
                    if (rol === "doctor" && !DentalRoles.sameDoctor(doctor.name, doctorActual)) {
                        return;
                    }
                    select.innerHTML += `<option value="${doctor.id}">${doctor.name}</option>`;
                });

                llenarDoctoresDisponibilidad();

                if (rol === "doctor" && select.options.length === 2) {
                    select.selectedIndex = 1;
                    select.disabled = true;
                }
            }
            catch (error) {
                apiActiva = false;
                DentalRoles.notify("No se pudo cargar doctores desde la API. Usando modo local.", "warning");
            }
        }

        async function cargarCitas() {
            if (!apiActiva) {
                renderCitas();
                abrirCitaNotificada();
                return;
            }

            try {
                citas = await DentalApi.getAppointments();
                localStorage.setItem("citas", JSON.stringify(citas));
            }
            catch (error) {
                citas = [];
                DentalRoles.notify("No se pudo cargar citas desde el servidor.", "error");
            }

            renderCitas();
            abrirCitaNotificada();
        }

        async function cargarPacientesSugeridos() {
            if (!apiActiva) {
                return;
            }

            try {
                pacientesDisponibles = await DentalApi.getPatients();
                const list = document.getElementById("pacientesSugeridos");
                list.innerHTML = "";

                pacientesDisponibles.forEach(paciente => {
                    const option = document.createElement("option");
                    option.value = paciente.nombre;
                    const identity = paciente.national_id || paciente.patient_code || paciente.phone || "";
                    option.label = identity
                        ? `${paciente.nombre} - ${identity}`
                        : paciente.nombre;
                    list.appendChild(option);
                });
            }
            catch (error) {
                pacientesDisponibles = [];
                DentalRoles.notify("No se pudieron cargar las sugerencias de pacientes.", "error");
            }
        }

        function llenarDoctoresDisponibilidad() {
            const select = document.getElementById("availabilityDoctor");
            if (!select) {
                return;
            }

            select.innerHTML = '<option value="">Seleccionar doctor</option>';
            doctoresApi.forEach(doctor => {
                if (rol === "doctor" && !DentalRoles.sameDoctor(doctor.name, doctorActual)) {
                    return;
                }
                select.innerHTML += `<option value="${doctor.id}">${DentalRoles.escapeHtml(doctor.name)}</option>`;
            });

            if (rol === "doctor" && select.options.length === 2) {
                select.selectedIndex = 1;
                select.disabled = true;
            }
        }

        async function cargarDisponibilidad() {
            if (!apiActiva) {
                document.getElementById("availabilityList").innerHTML =
                    '<div class="empty-state">La disponibilidad requiere conexion con la API.</div>';
                return;
            }

            try {
                const doctorId = rol === "doctor" ? "" : document.getElementById("availabilityDoctor").value;
                availabilityRules = await DentalApi.getAvailability(doctorId);
                renderDisponibilidad();
            }
            catch (error) {
                document.getElementById("availabilityList").innerHTML =
                    '<div class="empty-state">No se pudo cargar la disponibilidad.</div>';
                DentalRoles.notify(error.message, "error");
            }
        }

        function toggleAvailabilityLimit() {
            const isLimited = document.getElementById("availabilityStatus").value === "limitado";
            document.getElementById("availabilityLimitGroup").hidden = !isLimited;
            document.getElementById("availabilityLimit").required = isLimited;
        }

        function renderDisponibilidad() {
            const list = document.getElementById("availabilityList");
            if (!availabilityRules.length) {
                list.innerHTML = '<div class="empty-state">No hay avisos de disponibilidad registrados.</div>';
                return;
            }

            list.innerHTML = availabilityRules.map(rule => `
                <article class="availability-item">
                    <div>
                        <strong>${DentalRoles.escapeHtml(rule.doctor)} - ${DentalRoles.escapeHtml(rule.fecha)}</strong>
                        <p>${rule.status === "libre"
                            ? "Día libre"
                            : `Día limitado a ${DentalRoles.escapeHtml(rule.max_patients)} paciente(s)`}</p>
                        ${rule.note ? `<p>${DentalRoles.escapeHtml(rule.note)}</p>` : ""}
                    </div>
                    <button class="action-btn delete-btn" onclick="eliminarDisponibilidad('${rule.id}')">Quitar</button>
                </article>
            `).join("");
        }

        async function guardarDisponibilidad() {
            if (!apiActiva) {
                DentalRoles.notify("Esta funcion requiere conexion con la API.", "warning");
                return;
            }

            try {
                await DentalApi.saveAvailability({
                    doctorId: document.getElementById("availabilityDoctor").value,
                    fecha: document.getElementById("availabilityDate").value,
                    status: document.getElementById("availabilityStatus").value,
                    maxPatients: document.getElementById("availabilityLimit").value,
                    note: document.getElementById("availabilityNote").value.trim()
                });
                document.getElementById("availabilityDate").value = "";
                document.getElementById("availabilityNote").value = "";
                await cargarDisponibilidad();
                DentalRoles.notify("Disponibilidad actualizada.", "success");
            }
            catch (error) {
                DentalRoles.notify(error.message, "error");
            }
        }

        async function eliminarDisponibilidad(id) {
            try {
                await DentalApi.deleteAvailability(id);
                await cargarDisponibilidad();
                DentalRoles.notify("Aviso eliminado.", "success");
            }
            catch (error) {
                DentalRoles.notify(error.message, "error");
            }
        }

        function aplicarRolesCitas() {

            let title = document.getElementById("citasTitle");
            let form = document.getElementById("citaForm");
            let note = document.getElementById("roleNote");

            if (rol === "doctor") {
                title.innerHTML = "Mis Citas";
                form.style.display = "";
                note.innerText = "Agenda médica: puede programar procedimientos para sus pacientes asignados.";
                document.getElementById("busquedaCita").placeholder = "Buscar paciente o procedimiento";
            }
            else if (rol === "recepcion") {
                title.innerHTML = "Citas - Recepci\u00f3n";
                note.innerText = "Recepci\u00f3n: puede crear, confirmar y administrar citas.";
                document.getElementById("busquedaCita").placeholder = "Buscar paciente o doctor";
                document.getElementById("availabilityBox").style.display = "none";
            }
            else {
                title.innerHTML = "Gestión de Citas";
                note.innerText = "Administraci\u00f3n: vista completa de citas.";
                document.getElementById("busquedaCita").placeholder = "Buscar paciente o doctor";
            }

        }

        function fechaMananaLocal() {
            const [year, month, day] = fechaHoyLocal().split("-").map(Number);
            const date = new Date(Date.UTC(year, month - 1, day + 1, 12, 0, 0));
            return date.toISOString().slice(0, 10);
        }

        function setQuickFilter(filter) {
            quickFilter = filter || "todas";
            renderCitas();
        }

        function updateQuickFilterUi(count) {
            document.querySelectorAll("[data-quick-filter]").forEach(button => {
                const active = button.dataset.quickFilter === quickFilter;
                button.classList.toggle("active", active);
                button.setAttribute("aria-pressed", active ? "true" : "false");
            });

            const counter = document.getElementById("quickFilterCount");
            if (counter) {
                counter.textContent = `${count} ${count === 1 ? "resultado" : "resultados"}`;
            }
        }
        function citasVisibles() {
            let busqueda = (document.getElementById("busquedaCita")?.value || "").toLowerCase();
            let estadoFiltro = document.getElementById("estadoFiltro")?.value || "";
            const filtroFecha = filtrosUrl.get("fecha");
            const vista = filtrosUrl.get("vista");
            const hoy = fechaHoyLocal();
            const manana = fechaMananaLocal();
            const quickEstado = quickFilter === "pendientes"
                ? "pendiente"
                : (quickFilter === "confirmadas" ? "confirmada" : "");
            const quickFecha = quickFilter === "hoy"
                ? hoy
                : (quickFilter === "manana" ? manana : "");

            return citas
                .map((cita, index) => ({
                    cita: cita,
                    index: index
                }))
                .filter(item => {

                    const coincideRol = rol !== "doctor" || DentalRoles.sameDoctor(
                        item.cita.doctor,
                        doctorActual
                    );

                    const coincideBusqueda =
                        (item.cita.paciente || "").toLowerCase().includes(busqueda) ||
                        (rol !== "doctor" &&
                            (item.cita.doctor || "").toLowerCase().includes(busqueda)) ||
                        (rol === "doctor" &&
                            (item.cita.procedimiento || item.cita.motivo || "")
                                .toLowerCase()
                                .includes(busqueda));

                    const estadoNormalizado = estadoValor(item.cita.estado);
                    const coincideEstado =
                        (!estadoFiltro || estadoNormalizado === estadoFiltro) &&
                        (!quickEstado || estadoNormalizado === quickEstado);

                    const fechaCita = String(item.cita.fecha || "").slice(0, 10);
                    const coincideFecha = quickFecha
                        ? fechaCita === quickFecha
                        : (filtroFecha !== "hoy" || fechaCita === hoy);
                    const coincideVista = vista !== "proximas" ||
                        (fechaCita >= hoy && !["completada", "cancelada", "no_asistio", "reprogramada"].includes(
                            DentalRoles.normalizeText(item.cita.estado)
                        ));

                    return coincideRol && coincideBusqueda && coincideEstado &&
                        coincideFecha && coincideVista;

                });

        }

        function estadoClase(estado) {
            return DentalRoles.normalizeText(estado).replace(/\s+/g, "-");
        }

        function estadoValor(estado) {
            return DentalRoles.normalizeText(estado).replace(/-/g, "_").replace(/\s+/g, "_");
        }

        function estadoEtiqueta(estado) {
            const value = estadoValor(estado);
            return estadosCita[value] || estado || "Pendiente";
        }

        function fechaHoyLocal() {
            const parts = new Intl.DateTimeFormat("en-US", {
                timeZone: ZONA_HORARIA,
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }).formatToParts(new Date());

            const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
            return `${values.year}-${values.month}-${values.day}`;
        }

        function minutosDesdeHora(hora) {
            const [hours, minutes] = String(hora || "00:00").split(":").map(Number);
            return (hours * 60) + (minutes || 0);
        }

        function sumarMinutosHora(hora, minutos) {
            const total = minutosDesdeHora(hora) + Number(minutos || 0);
            const hours = Math.floor((total % 1440) / 60).toString().padStart(2, "0");
            const mins = (total % 60).toString().padStart(2, "0");
            return `${hours}:${mins}`;
        }

        function horariosSeCruzan(inicioA, duracionA, inicioB, duracionB) {
            const startA = minutosDesdeHora(inicioA);
            const endA = startA + Number(duracionA || 30);
            const startB = minutosDesdeHora(inicioB);
            const endB = startB + Number(duracionB || 30);
            return startA < endB && endA > startB;
        }

        function rangoHorarioCita(cita) {
            const inicio = (cita.hora || "").slice(0, 5) || "Sin hora";
            const fin = (cita.hora_fin || sumarMinutosHora(inicio, Number(cita.duracion_minutos || 30))).slice(0, 5);
            return inicio === "Sin hora" ? inicio : `${inicio} - ${fin}`;
        }

        function renderCitas() {

            let lista = document.getElementById("listaCitas");
            let visibles = citasVisibles();
            updateQuickFilterUi(visibles.length);

            lista.innerHTML = "";

            if (visibles.length === 0) {
                lista.innerHTML = `<div class='empty-state'>${(document.getElementById("busquedaCita")?.value || document.getElementById("estadoFiltro")?.value || quickFilter !== "todas") ? "No hay citas que coincidan con los filtros actuales." : "No hay citas para esta vista."}</div>`;
                return;
            }

            visibles.forEach(item => {

                let cita = item.cita;
                let index = item.index;
                let estado = estadoValor(cita.estado);
                let estadoCss = estadoClase(cita.estado);
                let estadoCerrado = ["completada", "cancelada", "no_asistio", "reprogramada"].includes(estado);
                let puedeConfirmar = rol !== "doctor" && estado === "pendiente";
                let puedeIniciar = rol !== "recepcion" && ["pendiente", "confirmada"].includes(estado);
                let puedeCompletar = rol !== "recepcion" && ["pendiente", "confirmada", "en_consulta"].includes(estado);
                let puedeCancelar = rol !== "doctor" && !estadoCerrado;
                let puedeNoAsistio = rol !== "doctor" && ["pendiente", "confirmada"].includes(estado);
                let puedeReprogramar = rol !== "doctor" && !estadoCerrado;
                let puedeRegistrarEvolucion = rol !== "recepcion" && apiActiva && cita.id && cita.patient_id && !["cancelada", "no_asistio", "reprogramada"].includes(estado);
                let confirmButton = puedeConfirmar ? `
                    <button class="action-btn confirm-btn" onclick="confirmarCita(${index})">
                        Confirmar
                    </button>
                ` : "";
                let startButton = puedeIniciar ? `
                    <button class="action-btn clinical-btn" onclick="iniciarConsulta(${index})">
                        En consulta
                    </button>
                ` : "";
                let completeButton = puedeCompletar ? `
                    <button class="action-btn complete-btn" onclick="completarCita(${index})">
                        Completar
                    </button>
                ` : "";
                let clinicalButton = puedeRegistrarEvolucion ? `
                    <button class="action-btn clinical-btn" onclick="abrirEvolucionClinica(${index})">
                        Evolución
                    </button>
                ` : "";
                let cancelButton = puedeCancelar ? `
                    <button class="action-btn cancel-btn" onclick="cancelarCita(${index})">
                        Cancelar
                    </button>
                ` : "";
                let missedButton = puedeNoAsistio ? `
                    <button class="action-btn missed-btn" onclick="marcarNoAsistio(${index})">
                        No asistió
                    </button>
                ` : "";
                let rescheduleButton = puedeReprogramar ? `
                    <button class="action-btn reschedule-btn" onclick="marcarReprogramada(${index})">
                        Reprogramar
                    </button>
                ` : "";
                let deleteButton = rol === "doctor" ? "" : `
                    <button class="action-btn delete-btn" onclick="eliminarCita(${index})">
                        Eliminar
                    </button>
                `;
                lista.innerHTML += `

            <article class="cita">

                <div class="appointment-main">
                    <div class="appointment-header">
                        <div class="appointment-title">
                            <strong title="${DentalRoles.escapeHtml(cita.paciente)}">${DentalRoles.escapeHtml(cita.paciente)}</strong>
                            <span title="${DentalRoles.escapeHtml(cita.procedimiento || cita.motivo || "Por definir")}">${DentalRoles.escapeHtml(cita.procedimiento || cita.motivo || "Por definir")}</span>
                        </div>
                        <span class="estado ${estadoCss}">
                            ${estadoEtiqueta(cita.estado)}
                        </span>
                    </div>

                    <div class="appointment-meta">
                        <div class="meta-item">
                            <span class="meta-label">Fecha</span>
                            <span class="meta-value">${DentalRoles.escapeHtml(cita.fecha || "Sin fecha")}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Hora</span>
                            <span class="meta-value">${DentalRoles.escapeHtml(rangoHorarioCita(cita))}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Doctor</span>
                            <span class="meta-value" title="${DentalRoles.escapeHtml(cita.doctor || "Sin doctor")}">${DentalRoles.escapeHtml(cita.doctor || "Sin doctor")}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Pieza dental</span>
                            <span class="meta-value">${cita.pieza_dental ? DentalRoles.escapeHtml(cita.pieza_dental) : "No aplica"}</span>
                        </div>
                    </div>
                </div>

                <div class="appointment-actions">
                    <button class="action-btn view-btn" onclick="verDetalleCita(${index})" title="Ver detalle de la cita">
                        Ver detalle
                    </button>

                    ${confirmButton}
                    ${startButton}
                    ${completeButton}
                    ${clinicalButton}
                    ${cancelButton}
                    ${missedButton}
                    ${rescheduleButton}
                    ${deleteButton}
                </div>

            </article>

                `;

            });

        }

        async function agregarCita() {

            let paciente = document.getElementById("paciente").value.trim();
            let fecha = document.getElementById("fecha").value;
            let hora = document.getElementById("hora").value;
            let duracionMinutos = Number(document.getElementById("duracion").value || 30);
            let doctor = document.getElementById("doctor").value;
            let categoriaProcedimiento = document.getElementById("categoriaProcedimiento").value;
            let procedimiento = document.getElementById("procedimiento").value;
            let piezaDental = document.getElementById("piezaDental").value;
            let detalleClinico = document.getElementById("detalleClinico").value.trim();
            let requierePieza = document.getElementById("procedimiento")
                .selectedOptions[0]?.dataset.requiresTooth === "true";
            let doctorNombre = document.getElementById("doctor").selectedOptions[0]?.textContent || doctor;
            let pacienteNormalizado = DentalRoles.normalizeText(paciente);
            let pacienteSeleccionado = pacientesDisponibles.find(item =>
                DentalRoles.normalizeText(item.nombre) === pacienteNormalizado ||
                DentalRoles.normalizeText(item.national_id) === pacienteNormalizado ||
                DentalRoles.normalizeText(item.patient_code) === pacienteNormalizado
            );

            if (paciente === "" || fecha === "" || hora === "" || doctor === "" ||
                categoriaProcedimiento === "" || procedimiento === "") {
                DentalRoles.notify("Completa todos los campos.", "warning");
                return;
            }

            if (requierePieza && !piezaDental) {
                DentalRoles.notify("Selecciona la pieza dental para este procedimiento.", "warning");
                return;
            }

            if (apiActiva && !pacienteSeleccionado) {
                DentalRoles.notify("Selecciona un paciente registrado de las sugerencias.", "warning");
                return;
            }

            const hoy = fechaHoyLocal();
            if (fecha < hoy) {
                DentalRoles.notify("La fecha no puede ser anterior a hoy.", "warning");
                return;
            }

            const citaDuplicada = citas.some(item =>
                item.fecha === fecha &&
                !["cancelada", "no_asistio", "reprogramada"].includes(estadoValor(item.estado)) &&
                (
                    item.doctor_id === doctor ||
                    DentalRoles.sameDoctor(item.doctor, doctorNombre)
                ) &&
                horariosSeCruzan(hora, duracionMinutos, item.hora, Number(item.duracion_minutos || 30))
            );

            if (citaDuplicada) {
                DentalRoles.notify("Ese doctor ya tiene una cita que cruza con ese horario.", "warning");
                return;
            }

            if (apiActiva) {
                try {
                    await DentalApi.createAppointment({
                        pacienteId: pacienteSeleccionado.id,
                        fecha,
                        hora,
                        duracionMinutos,
                        doctorId: doctor,
                        zonaHoraria: ZONA_HORARIA,
                        motivo: procedimiento,
                        categoriaProcedimiento,
                        procedimiento,
                        piezaDental,
                        detalleClinico
                    });

                    await cargarCitas();
                    limpiarCampos();
                    DentalRoles.notify("Cita guardada correctamente.", "success");
                    return;
                }
                catch (error) {
                    DentalRoles.notify(error.message || "No se pudo guardar la cita.", "error");
                    return;
                }
            }

            citas.push({
                paciente: paciente,
                fecha: fecha,
                hora: hora,
                duracion_minutos: duracionMinutos,
                hora_fin: sumarMinutosHora(hora, duracionMinutos),
                doctor: doctorNombre,
                motivo: procedimiento,
                categoria_procedimiento: categoriaProcedimiento,
                procedimiento,
                pieza_dental: piezaDental,
                detalle_clinico: detalleClinico,
                estado: "pendiente"
            });

            localStorage.setItem("citas", JSON.stringify(citas));

            aplicarRolesCitas();
            renderCitas();
            limpiarCampos();
            DentalRoles.notify("Cita guardada correctamente.", "success");

        }

        function limpiarCampos() {
            document.getElementById("paciente").value = "";
            document.getElementById("fecha").value = "";
            document.getElementById("hora").value = "";
            document.getElementById("duracion").value = "30";
            document.getElementById("categoriaProcedimiento").value = "";
            document.getElementById("procedimiento").innerHTML = '<option value="">Seleccionar procedimiento</option>';
            document.getElementById("procedimiento").disabled = true;
            document.getElementById("piezaDental").value = "";
            document.getElementById("piezaDentalGroup").hidden = true;
            document.getElementById("detalleClinico").value = "";
            if (rol !== "doctor") {
                document.getElementById("doctor").value = "";
            }
        }

        async function confirmarCita(index) {
            await cambiarEstadoCita(index, "confirmada", "Cita confirmada.", "success");
        }

        async function iniciarConsulta(index) {
            await cambiarEstadoCita(index, "en_consulta", "Cita marcada en consulta.", "success");
        }

        async function completarCita(index) {
            const cita = citas[index];

            if (apiActiva && cita?.id && cita?.patient_id && rol !== "recepcion") {
                abrirEvolucionClinica(index);
                return;
            }

            await cambiarEstadoCita(index, "completada", "Cita marcada como completada.", "success");
        }

        async function abrirEvolucionClinica(index) {
            const cita = citas[index];

            if (!cita || !cita.id || !cita.patient_id) {
                DentalRoles.notify("Esta cita no está vinculada a un paciente registrado.", "warning");
                return;
            }

            document.getElementById("clinicalCitaIndex").value = index;
            document.getElementById("clinicalEvolutionSubtitle").textContent =
                `${cita.paciente} - ${cita.fecha} - ${rangoHorarioCita(cita)}`;
            document.getElementById("clinicalProcedure").value = cita.procedimiento || cita.motivo || "";
            document.getElementById("clinicalDiagnosis").value = "";
            document.getElementById("clinicalTreatment").value = "";
            document.getElementById("clinicalPrescription").value = "";
            document.getElementById("clinicalNextSteps").value = "";
            document.getElementById("clinicalNote").value = "";
            document.getElementById("clinicalNotesList").innerHTML = '<div class="empty-state">Cargando historial...</div>';
            document.getElementById("clinicalEvolutionModal").classList.add("open");

            await cargarEvolucionClinica(cita);
        }

        function cerrarEvolucionClinica() {
            document.getElementById("clinicalEvolutionModal").classList.remove("open");
        }

        async function cargarEvolucionClinica(cita) {
            const list = document.getElementById("clinicalNotesList");

            try {
                clinicalNotes = await DentalApi.getClinicalNotes({ appointmentId: cita.id });
            }
            catch (error) {
                list.innerHTML = '<div class="empty-state">No se pudo cargar el historial clínico.</div>';
                return;
            }

            if (!clinicalNotes.length) {
                list.innerHTML = '<div class="empty-state">No hay evolución registrada para esta cita.</div>';
                return;
            }

            list.innerHTML = clinicalNotes.map(note => `
                <div class="clinical-note-item">
                    <small>${DentalRoles.escapeHtml(note.fecha_registro)} - ${DentalRoles.escapeHtml(note.doctor || "Doctor no asignado")}</small>
                    ${note.procedimiento ? `<p><strong>Procedimiento:</strong> ${DentalRoles.escapeHtml(note.procedimiento)}</p>` : ""}
                    ${note.diagnostico ? `<p><strong>Diagnóstico:</strong> ${DentalRoles.escapeHtml(note.diagnostico)}</p>` : ""}
                    ${note.tratamiento ? `<p><strong>Tratamiento:</strong> ${DentalRoles.escapeHtml(note.tratamiento)}</p>` : ""}
                    ${note.receta ? `<p><strong>Receta/indicaciones:</strong> ${DentalRoles.escapeHtml(note.receta)}</p>` : ""}
                    ${note.proxima_indicacion ? `<p><strong>Próxima indicación:</strong> ${DentalRoles.escapeHtml(note.proxima_indicacion)}</p>` : ""}
                    <p><strong>Nota:</strong> ${DentalRoles.escapeHtml(note.nota)}</p>
                </div>
            `).join("");
        }

        async function guardarEvolucionClinica() {
            const index = Number(document.getElementById("clinicalCitaIndex").value);
            const cita = citas[index];

            if (!cita) {
                DentalRoles.notify("No se encontró la cita seleccionada.", "error");
                return;
            }

            const note = document.getElementById("clinicalNote").value.trim();

            if (!note) {
                DentalRoles.notify("Escribe la nota médica de la evolución.", "warning");
                return;
            }

            try {
                await DentalApi.createClinicalNote({
                    patientId: cita.patient_id,
                    appointmentId: cita.id,
                    procedureName: document.getElementById("clinicalProcedure").value.trim(),
                    diagnosis: document.getElementById("clinicalDiagnosis").value.trim(),
                    treatment: document.getElementById("clinicalTreatment").value.trim(),
                    prescription: document.getElementById("clinicalPrescription").value.trim(),
                    nextSteps: document.getElementById("clinicalNextSteps").value.trim(),
                    note
                });

                cerrarEvolucionClinica();
                await cargarCitas();
                DentalRoles.notify("Evolución clínica guardada y cita completada.", "success");
            }
            catch (error) {
                DentalRoles.notify(error.message || "No se pudo guardar la evolución clínica.", "error");
            }
        }

        async function cancelarCita(index) {
            await cambiarEstadoCita(index, "cancelada", "Cita cancelada.", "warning");
        }

        async function marcarNoAsistio(index) {
            DentalRoles.confirmAction({
                title: "Marcar no asistió",
                message: "La cita quedara cerrada como paciente no asistió.",
                confirmText: "Marcar",
                type: "warning",
                onConfirm: async () => {
                    await cambiarEstadoCita(index, "no_asistio", "Cita marcada como no asistió.", "warning");
                }
            });
        }

        async function marcarReprogramada(index) {
            DentalRoles.confirmAction({
                title: "Marcar reprogramada",
                message: "Esta cita quedara cerrada como reprogramada. Luego crea una nueva cita con la nueva fecha y hora.",
                confirmText: "Reprogramar",
                type: "warning",
                onConfirm: async () => {
                    await cambiarEstadoCita(index, "reprogramada", "Cita marcada como reprogramada.", "success");
                }
            });
        }

        async function cambiarEstadoCita(index, nuevoEstado, mensaje, tipo = "success") {
            if (!citas[index]) {
                return;
            }

            if (apiActiva && citas[index]?.id) {
                try {
                    await DentalApi.updateAppointmentStatus(citas[index].id, nuevoEstado);
                    await cargarCitas();
                    DentalRoles.notify(mensaje, tipo);
                    return;
                }
                catch (error) {
                    DentalRoles.notify(error.message || "No se pudo actualizar la cita.", "error");
                    return;
                }
            }

            citas[index].estado = nuevoEstado;
            localStorage.setItem("citas", JSON.stringify(citas));
            aplicarRolesCitas();
            renderCitas();
            DentalRoles.notify(mensaje, tipo);
        }

        function eliminarCita(index) {
            if (rol === "doctor") {
                DentalRoles.notify("Los doctores no pueden eliminar citas.", "warning");
                return;
            }

            DentalRoles.confirmAction({
                title: "Eliminar cita",
                message: "Esta acción quitará la cita de la agenda.",
                confirmText: "Eliminar",
                onConfirm: async () => {
                    if (apiActiva && citas[index]?.id) {
                        await DentalApi.deleteAppointment(citas[index].id);
                        await cargarCitas();
                        DentalRoles.notify("Cita eliminada.", "success");
                        return;
                    }

                    citas.splice(index, 1);
                    localStorage.setItem("citas", JSON.stringify(citas));
                    aplicarRolesCitas();
                    renderCitas();
                    DentalRoles.notify("Cita eliminada.", "success");
                }
            });
        }

        function facturarCita(index) {
            const cita = citas[index];
            if (!cita || !cita.patient_id) {
                DentalRoles.notify("La cita no está vinculada a un paciente registrado.", "warning");
                return;
            }
            window.location.href = `facturacion.html?paciente=${encodeURIComponent(cita.patient_id)}`;
        }

        function verDetalleCita(index) {
            const cita = citas[index];
            if (!cita) {
                return;
            }

            DentalRoles.showDetails("Detalle de cita", [
                { label: "Paciente", value: cita.paciente },
                { label: "Doctor", value: cita.doctor },
                { label: "Área clínica", value: catalogoProcedimientos[cita.categoria_procedimiento]?.[0] || cita.categoria_procedimiento },
                { label: "Procedimiento", value: cita.procedimiento || cita.motivo },
                { label: "Pieza dental", value: cita.pieza_dental },
                { label: "Detalle clínico", value: cita.detalle_clinico },
                { label: "Fecha", value: cita.fecha },
                { label: "Hora", value: rangoHorarioCita(cita) },
                { label: "Duración", value: `${Number(cita.duracion_minutos || 30)} minutos` },
                { label: "Estado", value: estadoEtiqueta(cita.estado) }
            ]);
        }

        function abrirCitaNotificada() {
            const citaId = filtrosUrl.get("cita");

            if (!citaId || window.citaNotificadaAbierta) {
                return;
            }

            const index = citas.findIndex(cita => String(cita.id || "") === citaId);

            if (index === -1) {
                DentalRoles.notify("No se encontró la cita asignada o ya no esta disponible.", "warning");
                window.citaNotificadaAbierta = true;
                return;
            }

            window.citaNotificadaAbierta = true;
            verDetalleCita(index);
        }

        function irDashboard() {
            window.location.href = "dashboard.html";
        }

        function irPacientes() {
            window.location.href = "pacientes.html";
        }

        function irCitas() {
            window.location.href = "citas.html";
        }

        function irReportes() {
            window.location.href = "reportes.html";
        }

        function cerrarSesion() {
            DentalRoles.logout();
        }

        aplicarRolesCitas();
        cargarCatalogoClinico();

        if (filtrosUrl.get("fecha") === "hoy") {
            document.getElementById("roleNote").textContent += " Mostrando la agenda de hoy.";
        }
        else if (filtrosUrl.get("vista") === "proximas") {
            document.getElementById("roleNote").textContent += " Mostrando proximos tratamientos pendientes.";
        }

        document.getElementById("fecha").min = fechaHoyLocal();
        document.getElementById("availabilityDate").min = fechaHoyLocal();
        document.getElementById("availabilityDoctor").addEventListener("change", cargarDisponibilidad);

        Promise.all([
            cargarDoctoresCitas(),
            cargarPacientesSugeridos()
        ]).then(async () => {
            await Promise.all([cargarCitas(), cargarDisponibilidad()]);
        });

    </script>

</body>
</html>

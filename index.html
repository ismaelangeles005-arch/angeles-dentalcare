<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAELVEN Dental | Sistema de Gestión Odontológica</title>
    <link rel="icon" href="/images/maelven-dental-favicon.svg" type="image/svg+xml">
    <meta name="description" content="MAELVEN Dental - Sistema de Gestión Odontológica">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --color-primary: #2563A6;
            --color-primary-dark: #183B5B;
            --color-secondary: #2FA7A0;
            --color-bg: #F4F8FB;
            --color-surface: #FFFFFF;
            --color-text: #1F2937;
            --color-text-muted: #64748B;
            --color-border: rgba(148, 163, 184, 0.26);
            --color-danger: #B42318;
            --shadow-md: 0 22px 60px rgba(24, 59, 91, 0.16);
            --radius-md: 14px;
            --radius-lg: 18px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--color-text);
            background:
                radial-gradient(circle at top right, rgba(47, 167, 160, 0.14), transparent 34%),
                radial-gradient(circle at bottom left, rgba(37, 99, 166, 0.10), transparent 30%),
                linear-gradient(135deg, #f4f8fb 0%, #eef6f7 50%, #f8fafc 100%);
            overflow-x: hidden;
        }
        .access-shell { width: min(430px, 100%); position: relative; }
        .login-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-md);
        }
        .logo { text-align: center; margin-bottom: 18px; }
        .logo .brand-logo { width: min(280px, 100%); height: 98px; object-fit: contain; display: block; margin: 0 auto 8px; }
        .clinic-name { margin-top: 10px; color: var(--color-text-muted); font-size: 14px; font-weight: 700; }
        .welcome { text-align: center; margin-bottom: 22px; }
        .welcome h1 { color: var(--color-text); margin-bottom: 7px; font-size: 22px; }
        .welcome p { color: var(--color-text-muted); line-height: 1.45; }
        .pin-dots { display: flex; justify-content: center; gap: 12px; margin: 18px 0 20px; }
        .pin-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(37, 99, 166, 0.35);
            background: #fff;
            transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
        }
        .pin-dot.filled { background: var(--color-primary); border-color: var(--color-primary); transform: scale(1.05); }
        .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .pin-key, .pin-action, .login-btn {
            min-height: 56px;
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: var(--radius-md);
            background: #fff;
            color: var(--color-text);
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
        }
        .pin-key:hover, .pin-action:hover, .login-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(24, 59, 91, 0.10); }
        .pin-key:focus-visible, .pin-action:focus-visible, .login-btn:focus-visible, input:focus-visible {
            outline: 3px solid rgba(47, 167, 160, 0.32);
            outline-offset: 2px;
        }
        .pin-action { font-size: 14px; color: var(--color-primary-dark); background: rgba(37, 99, 166, 0.05); }
        .pin-action.icon { font-size: 18px; }
        .pin-message {
            min-height: 44px;
            margin: 14px 0 0;
            padding: 11px 13px;
            border-radius: var(--radius-md);
            font-weight: 800;
            text-align: center;
            display: none;
        }
        .pin-message.show { display: block; }
        .pin-message.error { background: rgba(180, 35, 24, 0.10); color: var(--color-danger); }
        .pin-message.success { background: rgba(46, 139, 114, 0.12); color: #17624e; }
        .shake { animation: shake 0.28s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            75% { transform: translateX(7px); }
        }
        .utility-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
        .utility-btn {
            border: none;
            background: transparent;
            color: var(--color-text-muted);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            padding: 8px 4px;
        }
        .utility-btn:hover { color: var(--color-primary-dark); }
        .legacy-panel { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--color-border); }
        .legacy-panel.show { display: block; }
        .input-group { margin-bottom: 12px; position: relative; }
        .input-group i { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: var(--color-text-muted); }
        .input-group input {
            width: 100%; min-height: 48px; padding: 13px 14px 13px 44px;
            border: 1px solid rgba(148, 163, 184, 0.32); border-radius: var(--radius-md);
            outline: none; color: var(--color-text); background: #ffffff; font-size: 15px;
        }
        .login-btn {
            width: 100%; min-height: 48px; border: none;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            color: #ffffff; font-size: 16px;
        }
        @media (max-width: 420px) {
            body { padding: 14px; }
            .login-box { padding: 22px; }
            .pin-key, .pin-action { min-height: 52px; }
            .utility-row { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <main class="access-shell">
        <section class="login-box" id="pinBox" aria-label="Acceso por PIN">
            <div class="logo">
                <img class="brand-logo" src="images/maelven-dental-logo.svg" alt="MAELVEN Dental" width="320" height="112">
                <div class="clinic-name">Sistema de Gestión Odontológica</div>
                <div class="clinic-name" id="clinicName">Clínica</div>
            </div>

            <div class="welcome">
                <h1>Ingrese su código de acceso</h1>
                <p>Acceso rápido para personal autorizado.</p>
            </div>

            <div class="pin-dots" id="pinDots" aria-label="PIN de cuatro dígitos">
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
                <span class="pin-dot"></span>
            </div>

            <div class="pin-pad" id="pinPad">
                <button class="pin-key" type="button" data-digit="1">1</button>
                <button class="pin-key" type="button" data-digit="2">2</button>
                <button class="pin-key" type="button" data-digit="3">3</button>
                <button class="pin-key" type="button" data-digit="4">4</button>
                <button class="pin-key" type="button" data-digit="5">5</button>
                <button class="pin-key" type="button" data-digit="6">6</button>
                <button class="pin-key" type="button" data-digit="7">7</button>
                <button class="pin-key" type="button" data-digit="8">8</button>
                <button class="pin-key" type="button" data-digit="9">9</button>
                <button class="pin-action" type="button" data-clear>Limpiar</button>
                <button class="pin-key" type="button" data-digit="0">0</button>
                <button class="pin-action icon" type="button" data-backspace aria-label="Borrar último dígito"><i class="fa-solid fa-delete-left"></i></button>
            </div>

            <div id="pinMessage" class="pin-message" role="status" aria-live="polite"></div>

            <div class="utility-row">
                <button class="utility-btn" type="button" onclick="toggleLegacyLogin()">Acceso administrador</button>
                <button class="utility-btn" type="button" onclick="closeDesktopApp()">Cerrar aplicación</button>
            </div>

            <div class="legacy-panel" id="legacyPanel">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="usuario" placeholder="Usuario" autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
                </div>
                <button class="login-btn" type="button" onclick="login()">Ingresar</button>
            </div>
        </section>
    </main>

    <script src="api.js?v=20260721pin"></script>
    <script>
        let pin = "";
        let pending = false;
        let legacyPending = false;
        const dots = Array.from(document.querySelectorAll(".pin-dot"));
        const pinBox = document.getElementById("pinBox");
        const messageBox = document.getElementById("pinMessage");
        const clinicName = localStorage.getItem("organizationName");
        const authNotice = sessionStorage.getItem("authNotice");
        if (authNotice) {
            showMessage(authNotice, "error");
            sessionStorage.removeItem("authNotice");
        }

        if (clinicName) {
            document.getElementById("clinicName").textContent = clinicName;
        }

        function updateDots() {
            dots.forEach((dot, index) => dot.classList.toggle("filled", index < pin.length));
        }

        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = `pin-message show ${type}`;
        }

        function clearMessage() {
            messageBox.textContent = "";
            messageBox.className = "pin-message";
        }

        function resetPin() {
            pin = "";
            updateDots();
        }

        function setPadDisabled(disabled) {
            document.querySelectorAll("#pinPad button").forEach(button => { button.disabled = disabled; });
        }

        function appendDigit(digit) {
            if (pending || legacyPending || pin.length >= 4) return;
            clearMessage();
            pin += digit;
            updateDots();
            if (pin.length === 4) {
                submitPin();
            }
        }

        function removeDigit() {
            if (pending || !pin.length) return;
            clearMessage();
            pin = pin.slice(0, -1);
            updateDots();
        }

        async function submitPin() {
            if (pending || legacyPending || pin.length !== 4) return;
            pending = true;
            setPadDisabled(true);

            try {
                const user = await DentalApi.pinLogin(pin);
                const displayName = user.doctor || user.name || "usuario";
                showMessage(`Bienvenido, ${displayName}`, "success");
                setTimeout(() => {
                    window.location.href = user.mustChangePassword ? "cambiar-password.html" : "dashboard.html";
                }, 650);
            }
            catch (error) {
                showMessage(error.message || "Código incorrecto. Inténtelo nuevamente.", "error");
                pinBox.classList.remove("shake");
                void pinBox.offsetWidth;
                pinBox.classList.add("shake");
                resetPin();
            }
            finally {
                pending = false;
                setPadDisabled(false);
            }
        }

        document.getElementById("pinPad").addEventListener("click", event => {
            const digitButton = event.target.closest("[data-digit]");
            if (digitButton) appendDigit(digitButton.dataset.digit);
            if (event.target.closest("[data-backspace]")) removeDigit();
            if (event.target.closest("[data-clear]")) { clearMessage(); resetPin(); }
        });

        document.addEventListener("keydown", event => {
            if (document.getElementById("legacyPanel").classList.contains("show") && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
                if (event.key === "Enter") login();
                return;
            }
            if (/^\d$/.test(event.key)) appendDigit(event.key);
            else if (event.key === "Backspace") removeDigit();
            else if (event.key === "Escape") { clearMessage(); resetPin(); }
        });

        function toggleLegacyLogin() {
            document.getElementById("legacyPanel").classList.toggle("show");
            document.getElementById("usuario").focus();
        }

        function closeDesktopApp() {
            window.close();
            showMessage("Si la ventana no se cierra, usa el botón cerrar de la aplicación.", "success");
        }

        async function login() {
            if (legacyPending || pending) return;
            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value;

            if (!usuario || !password) {
                showMessage("Completa todos los campos", "error");
                return;
            }

            try {
                legacyPending = true;
                showMessage("Validando acceso...", "success");
                const user = await DentalApi.login(usuario, password);
                window.location.href = user.mustChangePassword
                    ? "cambiar-password.html"
                    : (user.scope === "PLATFORM" ? "platform.html" : "dashboard.html");
            }
            catch (error) {
                document.getElementById("password").value = "";
                showMessage(error.message || "Usuario o contraseña incorrectos", "error");
            }
            finally {
                legacyPending = false;
            }
        }
    </script>
</body>
</html>

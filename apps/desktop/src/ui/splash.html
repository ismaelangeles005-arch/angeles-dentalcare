<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angeles DentalCare</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #183B5B;
      background: linear-gradient(135deg, #f4f8fb, #eef6f7);
    }
    .splash { text-align: center; padding: 28px; }
    .mark {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: #2563A6;
      box-shadow: 0 18px 42px rgba(24, 59, 91, .20);
    }
    .mark svg { width: 54px; height: 54px; fill: #fff; }
    h1 { margin: 0; font-size: 25px; letter-spacing: 1px; }
    p { margin: 10px 0 0; color: #64748B; font-weight: 700; }
    .bar { width: 220px; height: 5px; margin: 24px auto 0; overflow: hidden; border-radius: 999px; background: #dbe7ef; }
    .bar::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: #2FA7A0; animation: load 1.1s infinite ease-in-out; }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(240%); } }
  </style>
</head>
<body>
  <section class="splash">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 120 120"><path d="M60 22 Q80 10 94 25 Q111 43 100 76 Q91 100 75 110 Q67 116 60 108 Q53 116 45 110 Q29 100 20 76 Q9 43 26 25 Q40 10 60 22 Z" /></svg>
    </div>
    <h1>Angeles DentalCare</h1>
    <p>Preparando sistema clinico</p>
    <div class="bar"></div>
  </section>
</body>
</html>

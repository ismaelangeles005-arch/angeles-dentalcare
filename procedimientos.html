<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedimientos - Angeles DentalCare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .main{flex:1;padding:30px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.logout-btn{background:#dc2626;color:#fff;border:0;padding:12px 18px;border-radius:12px}.panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(15,23,42,.08);margin-bottom:20px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px}label{font-weight:bold;color:#334155;display:grid;gap:6px}.primary-btn{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:12px 14px;font-weight:bold}.secondary-btn{background:#64748b;color:#fff;border:0;border-radius:10px;padding:12px 14px;font-weight:bold}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}th{color:#475569;font-size:13px;text-transform:uppercase}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{border:0;border-radius:8px;padding:8px 10px;color:#fff;background:#2563eb}.actions .neutral{background:#64748b}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#dcfce7;color:#166534}.badge.off{background:#fee2e2;color:#991b1b}.role-note{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe;border-radius:12px;padding:12px 14px;margin:0 0 16px;font-weight:700}.edit-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.edit-backdrop.open{display:flex}.edit-dialog{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(15,23,42,.28)}.edit-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:20px 22px;border-bottom:1px solid #e2e8f0}.edit-header h2{margin:0}.close-btn{width:38px;height:38px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;font-size:22px}.edit-body{padding:22px}.preview-box{margin-top:16px;border:1px solid #dbe3ef;background:#f8fafc;border-radius:12px;padding:14px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}@media(max-width:760px){body{display:block}.sidebar{width:100%;min-width:0}.main{padding:20px}.topbar,.modal-actions{display:grid;align-items:stretch}}
    </style>
</head>
<body>
    <div class="sidebar"><div class="logo"><svg class="brand-logo" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Angeles DentalCare"><g class="logo-group"><g class="icon-group" transform="translate(340,122)"><path d="M0 -37 Q20 -50 34 -37 Q50 -22 42 6 Q32 32 18 47 Q9 56 0 47 Q-9 56 -18 47 Q-32 32 -42 6 Q-50 -22 -34 -37 Q-20 -50 0 -37 Z" fill="white" /></g><g class="text-main"><text x="340" y="208" font-family="Georgia" font-size="42" fill="white" text-anchor="middle">ANGELES</text></g><g class="text-sub"><text x="340" y="244" font-family="Arial" font-size="16" fill="white" text-anchor="middle">DENTALCARE</text></g></g></svg></div><div class="menu"><button data-nav="dashboard" onclick="location.href='dashboard.html'"><i class="fa-solid fa-chart-line"></i> Dashboard</button><button data-nav="pacientes" onclick="location.href='pacientes.html'"><i class="fa-solid fa-user-group"></i> Pacientes</button><button data-nav="citas" onclick="location.href='citas.html'"><i class="fa-solid fa-calendar-days"></i> Citas</button><button data-nav="reportes" onclick="location.href='reportes.html'"><i class="fa-solid fa-chart-column"></i> Reportes</button></div></div>
    <main class="main"><div class="topbar"><h1>Procedimientos y precios</h1><button class="logout-btn" onclick="DentalRoles.logout()">Cerrar Sesion</button></div>
        <section class="panel" id="procedureFormPanel"><h2>Nuevo procedimiento</h2><form id="procedureForm" class="form-grid"><label>Area clinica<select id="categoryName" required></select></label><label>Procedimiento<input id="procedureName" placeholder="Consulta inicial" required></label><label>Precio base RD$<input id="basePrice" class="clean-number" type="number" min="0" step="0.01" value="0" required></label><label>Duracion<select id="durationMinutes"><option>15</option><option selected>30</option><option>45</option><option>60</option><option>90</option><option>120</option></select></label><label>Requiere pieza<select id="requiresTooth"><option value="false">No</option><option value="true">Si</option></select></label><label>Estado<select id="procedureActive"><option value="true">Activo</option><option value="false">Inactivo</option></select></label><button class="primary-btn" type="submit"><i class="fa-solid fa-floppy-disk"></i> Guardar</button><button class="secondary-btn" type="button" onclick="resetForm()">Limpiar</button></form></section>
        <section class="panel"><h2>Catalogo</h2><p class="role-note" id="readOnlyNote" hidden>Vista de consulta: los precios y procedimientos son administrados por administracion.</p><div class="table-wrap"><table><thead><tr><th>Area</th><th>Procedimiento</th><th>Precio</th><th>Duracion</th><th>Pieza</th><th>Estado</th><th data-admin-column>Acciones</th></tr></thead><tbody id="proceduresList"><tr><td colspan="7">Cargando...</td></tr></tbody></table></div></section>
    </main>
    <div class="edit-backdrop" id="editModal" onclick="if(event.target===this) closeEditModal()"><div class="edit-dialog"><div class="edit-header"><div><h2>Editar procedimiento</h2><p>Previsualiza los cambios antes de guardar.</p></div><button class="close-btn" onclick="closeEditModal()" type="button">&times;</button></div><div class="edit-body"><input type="hidden" id="editId"><div class="form-grid"><label>Area clinica<select id="editCategory" onchange="renderEditPreview()"></select></label><label>Procedimiento<input id="editName" oninput="renderEditPreview()"></label><label>Precio base RD$<input id="editPrice" class="clean-number" type="number" min="0" step="0.01" oninput="renderEditPreview()"></label><label>Duracion<select id="editDuration" onchange="renderEditPreview()"><option>15</option><option>30</option><option>45</option><option>60</option><option>90</option><option>120</option></select></label><label>Requiere pieza<select id="editRequiresTooth" onchange="renderEditPreview()"><option value="false">No</option><option value="true">Si</option></select></label><label>Estado<select id="editActive" onchange="renderEditPreview()"><option value="true">Activo</option><option value="false">Inactivo</option></select></label></div><div class="preview-box" id="editPreview"></div><div class="modal-actions"><button class="secondary-btn" type="button" onclick="closeEditModal()">Cancelar</button><button class="primary-btn" type="button" onclick="saveEditModal()">Guardar cambios</button></div></div></div></div>
    <script src="api.js?v=20260628c"></script><script src="roles.js?v=20260628c"></script>
    <script>
        DentalRoles.protectPage({ active: "procedimientos" });
        const canManageProcedures = ["head_admin", "admin"].includes(DentalRoles.rol);
        const procedureAreas=[{key:"evaluacion",name:"Evaluacion y diagnostico"},{key:"prevencion",name:"Prevencion"},{key:"caries",name:"Caries"},{key:"extraccion",name:"Extraccion"},{key:"endodoncia",name:"Endodoncia"},{key:"periodoncia",name:"Periodoncia"},{key:"ortodoncia",name:"Ortodoncia"},{key:"protesis",name:"Protesis"},{key:"cirugia",name:"Cirugia oral"},{key:"estetica",name:"Estetica dental"},{key:"radiologia",name:"Radiologia"},{key:"urgencia",name:"Urgencia"}];
        let procedures=[]; const money=value=>new Intl.NumberFormat("es-DO",{style:"currency",currency:"DOP"}).format(Number(value||0));
        function setupNumberInputs(root=document){root.querySelectorAll('input.clean-number[type="number"]').forEach(input=>{if(input.dataset.cleanReady)return;input.dataset.cleanReady="true";input.addEventListener("focus",()=>{if(input.value==="0"||input.value==="0.00")input.value="";else input.select();});input.addEventListener("blur",()=>{if(input.value.trim()==="")input.value="0";});});}
        function areaOptions(selected=""){return '<option value="">Seleccionar area</option>'+procedureAreas.map(a=>`<option value="${a.name}" data-key="${a.key}" ${a.name===selected?"selected":""}>${a.name}</option>`).join("");}
        function areaKey(selectId){const opt=document.getElementById(selectId).selectedOptions[0];return opt?.dataset.key||"";}
        function renderAreaOptions(){document.getElementById("categoryName").innerHTML=areaOptions();document.getElementById("editCategory").innerHTML=areaOptions();}
        function applyRoleMode(){if(canManageProcedures)return;document.getElementById("procedureFormPanel").style.display="none";document.getElementById("readOnlyNote").hidden=false;document.querySelectorAll("[data-admin-column]").forEach(cell=>cell.style.display="none");}
        async function loadProcedures(){try{procedures=await DentalApi.getProcedures(canManageProcedures);renderProcedures();}catch(error){DentalRoles.notify(error.message,"error");}}
        function renderProcedures(){const list=document.getElementById("proceduresList");const colspan=canManageProcedures?7:6;list.innerHTML=procedures.length?procedures.map(item=>`<tr><td>${DentalRoles.escapeHtml(item.category_name)}</td><td>${DentalRoles.escapeHtml(item.name)}</td><td>${money(item.base_price)}</td><td>${item.duration_minutes} min</td><td>${item.requires_tooth?"Si":"No"}</td><td><span class="badge ${item.active?"":"off"}">${item.active?"Activo":"Inactivo"}</span></td>${canManageProcedures?`<td><div class="actions"><button type="button" onclick="editProcedure('${item.id}')">Editar</button><button type="button" class="neutral" onclick="toggleActive('${item.id}')">${item.active?"Desactivar":"Activar"}</button></div></td>`:""}</tr>`).join(""):`<tr><td colspan="${colspan}">No hay procedimientos.</td></tr>`;}
        function resetForm(){document.getElementById("procedureForm").reset();document.getElementById("basePrice").value="0";}
        function buildPayload(prefix=""){const edit=prefix==="edit";const categoryId=edit?"editCategory":"categoryName";return{categoryKey:areaKey(categoryId),categoryName:document.getElementById(categoryId).value,name:document.getElementById(edit?"editName":"procedureName").value.trim(),basePrice:document.getElementById(edit?"editPrice":"basePrice").value||0,durationMinutes:document.getElementById(edit?"editDuration":"durationMinutes").value,requiresTooth:document.getElementById(edit?"editRequiresTooth":"requiresTooth").value==="true",active:document.getElementById(edit?"editActive":"procedureActive").value==="true"};}
        async function saveProcedure(id,payload){if(!payload.categoryKey||!payload.categoryName||!payload.name){DentalRoles.notify("Completa area y procedimiento.","warning");return;}try{if(id)await DentalApi.updateProcedure(id,payload);else await DentalApi.createProcedure(payload);resetForm();closeEditModal();await loadProcedures();DentalRoles.notify("Procedimiento guardado.","success");}catch(error){DentalRoles.notify(error.message,"error");}}
        document.getElementById("procedureForm").addEventListener("submit",e=>{e.preventDefault();saveProcedure(null,buildPayload(""));});
        function editProcedure(id){const item=procedures.find(row=>row.id===id);if(!item)return;document.getElementById("editId").value=item.id;document.getElementById("editCategory").innerHTML=areaOptions(item.category_name);document.getElementById("editName").value=item.name;document.getElementById("editPrice").value=item.base_price;document.getElementById("editDuration").value=item.duration_minutes;document.getElementById("editRequiresTooth").value=String(item.requires_tooth);document.getElementById("editActive").value=String(item.active);renderEditPreview();document.getElementById("editModal").classList.add("open");setupNumberInputs(document.getElementById("editModal"));}
        function renderEditPreview(){const p=buildPayload("edit");document.getElementById("editPreview").innerHTML=`<strong>${DentalRoles.escapeHtml(p.categoryName||"Sin area")}</strong><br>${DentalRoles.escapeHtml(p.name||"Sin nombre")} · ${money(p.basePrice)} · ${p.durationMinutes} min · Pieza: ${p.requiresTooth?"Si":"No"} · ${p.active?"Activo":"Inactivo"}`;}
        function closeEditModal(){document.getElementById("editModal").classList.remove("open");}
        function saveEditModal(){saveProcedure(document.getElementById("editId").value,buildPayload("edit"));}
        async function toggleActive(id){const item=procedures.find(row=>row.id===id);if(!item)return;await saveProcedure(id,{categoryKey:item.category_key,categoryName:item.category_name,name:item.name,basePrice:item.base_price,durationMinutes:item.duration_minutes,requiresTooth:item.requires_tooth,active:!item.active});}
        renderAreaOptions();setupNumberInputs();applyRoleMode();loadProcedures();
    </script>
</body>
</html>
